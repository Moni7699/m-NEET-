<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f50">

  <title>mNEET | Student Dashboard</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f3f8f5;
      --card: #ffffff;
      --text: #173329;
      --muted: #718078;
      --green: #087f50;
      --green-dark: #066640;
      --border: #dce8e0;
      --soft: #eaf7ef;
      --shadow: 0 8px 25px rgba(10, 75, 45, 0.07);
    }

    body.dark {
      color-scheme: dark;
      --bg: #0d1713;
      --card: #17231d;
      --text: #edf7f0;
      --muted: #a4b6aa;
      --green: #22a66b;
      --green-dark: #168451;
      --border: #304238;
      --soft: #203b2c;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.2s, color 0.2s;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid rgba(8, 127, 80, 0.35);
      outline-offset: 3px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 900px;
      min-height: 65px;
      margin: auto;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--text);
    }

    .brand span {
      color: #d7a51b;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--card);
      font-size: 12px;
      font-weight: 700;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .welcome-card {
      padding: 23px;
      border-radius: 18px;
      background: linear-gradient(125deg, #087f50, #075e40);
      color: white;
      box-shadow: var(--shadow);
    }

    .welcome-label {
      margin-bottom: 7px;
      font-size: 12px;
      opacity: 0.85;
    }

    .welcome-card h1 {
      font-size: 25px;
      line-height: 1.35;
      margin-bottom: 7px;
    }

    .welcome-card p {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .section-heading {
      margin: 27px 0 6px;
      font-size: 19px;
      font-weight: 800;
    }

    .section-subtitle {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Small subject cards: one per row */

    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .subject-card {
      width: 100%;
      min-height: 76px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, transform 0.2s;
    }

    .subject-card:hover {
      border-color: var(--green);
      transform: translateY(-1px);
    }

    .subject-icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--soft);
      font-size: 23px;
    }

    .subject-info {
      flex: 1;
      min-width: 0;
    }

    .subject-name {
      font-size: 15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .subject-caption {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .subject-arrow {
      color: var(--green);
      font-size: 22px;
      font-weight: 700;
    }

    .status-box {
      padding: 20px 14px;
      text-align: center;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .status-box strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 15px;
    }

    .retry-btn {
      margin-top: 12px;
      padding: 9px 16px;
      border: 0;
      border-radius: 9px;
      background: var(--green);
      color: white;
      font-weight: 700;
    }

    .footer {
      padding: 24px 10px 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .topbar-inner {
        min-height: 60px;
        padding: 10px 14px;
      }

      .brand {
        font-size: 23px;
      }

      .icon-btn {
        padding: 8px;
      }

      .page {
        padding: 19px 14px 30px;
      }

      .welcome-card {
        padding: 20px 18px;
        border-radius: 15px;
      }

      .welcome-card h1 {
        font-size: 22px;
      }

      .section-heading {
        font-size: 18px;
      }

      .subject-card {
        min-height: 72px;
        padding: 11px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <div class="brand">m<span>NEET</span></div>

      <div class="top-actions">
        <button
          id="themeToggle"
          class="icon-btn"
          type="button"
          aria-label="Change theme"
        >🌙 Dark</button>

        <button
          id="logoutButton"
          class="icon-btn"
          type="button"
        >Logout ↗</button>
      </div>

    </div>
  </header>

  <main class="page">

    <section class="welcome-card">
      <div class="welcome-label">STUDENT DASHBOARD</div>
      <h1 id="welcomeTitle">Welcome to mNEET!</h1>
      <p>Your NEET preparation starts here. Choose a subject to practise.</p>
    </section>

    <h2 class="section-heading">Choose Your Subject</h2>

    <p class="section-subtitle">
      Select a subject to explore its published chapters and available quizzes.
    </p>

    <section
      id="subjectList"
      class="subject-list"
      aria-label="Available subjects"
      aria-live="polite"
    >
      <div class="status-box">
        <strong>Loading subjects...</strong>
        Please wait.
      </div>
    </section>

    <div class="footer">
      <strong>mNEET</strong><br>
      Simple • Focused • For Your Dream
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

  <!-- Shared Firebase configuration -->
  <script src="js/firebase.js"></script>

  <script>
    "use strict";

    const subjectList = document.getElementById("subjectList");
    const welcomeTitle = document.getElementById("welcomeTitle");
    const themeToggle = document.getElementById("themeToggle");
    const logoutButton = document.getElementById("logoutButton");

    let currentUser = null;
    let authChecked = false;
    let profileVerified = false;
    let loading = false;
    let pageRedirecting = false;

    /* ---------- THEME ---------- */

    function applyTheme(theme) {
      const dark = theme === "dark";

      document.body.classList.toggle("dark", dark);

      themeToggle.textContent = dark
        ? "☀️ Light"
        : "🌙 Dark";

      themeToggle.setAttribute("aria-pressed", String(dark));
    }

    applyTheme(
      localStorage.getItem("mneetTheme") === "dark"
        ? "dark"
        : "white"
    );

    themeToggle.addEventListener("click", function () {
      const nextTheme = document.body.classList.contains("dark")
        ? "white"
        : "dark";

      localStorage.setItem("mneetTheme", nextTheme);
      applyTheme(nextTheme);
    });

    /* ---------- STATUS DISPLAY ---------- */

    function showStatus(title, detail, showRetry = false) {
      subjectList.replaceChildren();

      const box = document.createElement("div");
      box.className = "status-box";

      const heading = document.createElement("strong");
      heading.textContent = title;

      const description = document.createElement("div");
      description.textContent = detail;

      box.append(heading, description);

      if (showRetry) {
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "retry-btn";
        retry.textContent = "Try Again";
        retry.addEventListener("click", loadSubjects);
        box.appendChild(retry);
      }

      subjectList.appendChild(box);
    }

    /* ---------- SUBJECT ICON ---------- */

    function getSubjectIcon(name) {
      const value = name.toLowerCase();

      if (value.includes("biology")) return "🧬";
      if (value.includes("physics")) return "⚛️";
      if (value.includes("chemistry")) return "🧪";

      return "📘";
    }

    /* ---------- LOAD SUBJECTS ---------- */

    async function loadSubjects() {
      if (loading || pageRedirecting) return;

      if (!currentUser || !profileVerified) {
        showStatus(
          "Checking your account...",
          "Please wait while we verify your student profile."
        );
        return;
      }

      if (!window.db) {
        showStatus(
          "Firebase is not connected",
          "Check the configuration in js/firebase.js.",
          true
        );
        return;
      }

      loading = true;

      showStatus(
        "Loading subjects...",
        "Getting the latest published subjects."
      );

      try {
        const snapshot = await db
          .collection("subjects")
          .where("published", "==", true)
          .get();

        const subjects = [];

        snapshot.forEach(function (doc) {
          const data = doc.data();

          subjects.push({
            id: doc.id,
            name: typeof data.name === "string"
              ? data.name.trim()
              : "",
            order: Number(data.order) || 0
          });
        });

        const validSubjects = subjects
          .filter(subject => subject.name.length > 0)
          .sort((a, b) => {
            if (a.order !== b.order) {
              return a.order - b.order;
            }

            return a.name.localeCompare(b.name);
          });

        subjectList.replaceChildren();

        if (validSubjects.length === 0) {
          showStatus(
            "No subjects available yet",
            "Subjects will appear here after the administrator publishes them."
          );
          return;
        }

        validSubjects.forEach(function (subject) {
          const card = document.createElement("button");

          card.type = "button";
          card.className = "subject-card";
          card.setAttribute(
            "aria-label",
            "Open " + subject.name
          );

          const icon = document.createElement("span");
          icon.className = "subject-icon";
          icon.textContent = getSubjectIcon(subject.name);

          const info = document.createElement("span");
          info.className = "subject-info";

          const name = document.createElement("span");
          name.className = "subject-name";
          name.textContent = subject.name;

          const caption = document.createElement("span");
          caption.className = "subject-caption";
          caption.textContent = "View chapters and quizzes";

          info.append(name, document.createElement("br"), caption);

          const arrow = document.createElement("span");
          arrow.className = "subject-arrow";
          arrow.textContent = "›";

          card.append(icon, info, arrow);

          card.addEventListener("click", function () {
            localStorage.setItem("activeSubject", subject.id);
            localStorage.removeItem("activeChapter");
            localStorage.removeItem("activeQuizType");

            window.location.href = "chapter.html";
          });

          subjectList.appendChild(card);
        });

      } catch (error) {
        console.error("Could not load subjects:", error);

        showStatus(
          "Unable to load subjects",
          error.code === "permission-denied"
            ? "Firestore Rules are blocking access to published subjects."
            : "Check your internet connection and Firebase configuration.",
          true
        );

      } finally {
        loading = false;
      }
    }

    /* ---------- LOGOUT ---------- */

    logoutButton.addEventListener("click", async function () {
      if (!window.auth) {
        window.location.replace("index.html");
        return;
      }

      logoutButton.disabled = true;

      try {
        await auth.signOut();

        localStorage.removeItem("activeSubject");
        localStorage.removeItem("activeChapter");
        localStorage.removeItem("activeQuizType");

        window.location.replace("index.html");

      } catch (error) {
        console.error("Logout failed:", error);

        logoutButton.disabled = false;

        alert("Logout failed. Please check your connection and try again.");
      }
    });

    /* ---------- AUTHENTICATION & PROFILE ---------- */

    if (window.mneetFirebaseReady !== true || !window.auth || !window.db) {
      showStatus(
        "Firebase configuration required",
        "Complete js/firebase.js with your real Firebase configuration."
      );

    } else {
      auth.onAuthStateChanged(async function (user) {
        currentUser = user;
        authChecked = true;
        profileVerified = false;

        if (!user) {
          pageRedirecting = true;
          window.location.replace("index.html");
          return;
        }

        try {
          const profile = await db
            .collection("users")
            .doc(user.uid)
            .get();

          if (!profile.exists) {
            await auth.signOut();

            showStatus(
              "Student profile not found",
              "Please register again or contact the administrator."
            );

            return;
          }

          const data = profile.data();

          if (data.role !== "student" || data.status !== "active") {
            await auth.signOut();

            showStatus(
              "Student access unavailable",
              "This account does not have active student access."
            );

            return;
          }

          const fullName =
            typeof data.fullName === "string"
              ? data.fullName.trim()
              : "";

          welcomeTitle.textContent = fullName
            ? "Welcome, " + fullName + "!"
            : "Welcome to mNEET!";

          profileVerified = true;

          await loadSubjects();

        } catch (error) {
          console.error("Account verification failed:", error);

          showStatus(
            "Could not verify your account",
            "Check Firestore permissions and your internet connection.",
            true
          );
        }
      });
    }
  </script>

</body>
</html>
