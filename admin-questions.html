
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Manage Questions | mNEET</title>

<style>
:root{
  --bg:#101827;
  --card:#192538;
  --input:#101827;
  --text:#f1f5f9;
  --muted:#a5b4c7;
  --border:#304158;
  --yellow:#ffc107;
  --green:#22c55e;
  --red:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.brand{font-size:21px;font-weight:800}
.brand span{color:var(--yellow)}
.actions{display:flex;gap:7px}
.container{
  max-width:850px;
  margin:auto;
  padding:15px 12px 40px;
}
.back{
  display:inline-block;
  color:var(--yellow);
  text-decoration:none;
  margin-bottom:18px;
}
h1{font-size:23px;margin:0 0 15px}
h2{font-size:17px;margin:0 0 14px}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.field{min-width:0}
.full{grid-column:1/-1}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  outline:none;
}
textarea{
  min-height:65px;
  resize:vertical;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--yellow);
}
input[type=file]{font-size:12px}
.btn{
  border:0;
  border-radius:8px;
  padding:10px 13px;
  font-weight:bold;
}
.green{background:var(--green);color:#052e16}
.yellow{background:var(--yellow);color:#251d00}
.gray{background:var(--border);color:var(--text)}
.red{background:var(--red);color:white}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}
.notice{
  display:none;
  padding:11px;
  border-radius:8px;
  margin-bottom:13px;
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.notice.success{display:block;background:#14532d;color:white}
.notice.error{display:block;background:#7f1d1d;color:white}
.notice.info{display:block;background:#1e3a5f;color:white}
.preview{
  display:none;
  margin-top:8px;
  padding:8px;
  border:1px dashed var(--border);
  border-radius:8px;
}
.preview img{
  max-width:100%;
  max-height:190px;
  object-fit:contain;
  display:block;
  border-radius:6px;
}
.small{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.option{
  background:var(--input);
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
}
.option label{color:var(--yellow)}
.progress{
  display:none;
  margin-top:13px;
}
.track{
  height:8px;
  background:var(--border);
  border-radius:20px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0;
  background:var(--green);
  transition:width .2s;
}
.progressText{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}
.question{
  padding:12px;
  border:1px solid var(--border);
  background:var(--input);
  border-radius:10px;
  margin-top:10px;
}
.questionHead{
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.questionText{
  font-weight:bold;
  font-size:14px;
  line-height:1.6;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.qimg{
  display:block;
  max-width:100%;
  max-height:220px;
  object-fit:contain;
  margin-top:10px;
  border-radius:7px;
}
.qmeta{
  font-size:11px;
  color:var(--muted);
  margin-top:9px;
  line-height:1.6;
}
.qoptions{
  font-size:13px;
  line-height:1.8;
  margin-top:8px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.qactions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:11px;
}
.qactions button{
  font-size:11px;
  padding:8px 10px;
}
.badge{
  font-size:10px;
  padding:5px 7px;
  border-radius:5px;
  white-space:nowrap;
  height:max-content;
}
.on{background:#14532d;color:#bbf7d0}
.off{background:#713f12;color:#fde68a}
.empty{
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
@media(max-width:550px){
  .grid,.options{grid-template-columns:1fr}
  .full{grid-column:auto}
  .panel{padding:12px}
  h1{font-size:21px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">m<span>NEET</span>
    <small style="font-size:11px;color:var(--muted)">ADMIN</small>
  </div>
  <div class="actions">
    <button class="btn gray" id="themeBtn">☀️ / 🌙</button>
    <button class="btn gray" id="logoutBtn">Logout</button>
  </div>
</header>

<main class="container">

<a class="back" href="admin.html">← Admin Dashboard</a>

<h1>Manage Questions</h1>

<div id="notice" class="notice"></div>

<section class="panel">
<h2 id="formTitle">➕ Add Question</h2>

<form id="questionForm">

<div class="grid">

  <div class="field">
    <label>Subject *</label>
    <select id="subject" required>
      <option value="">Loading...</option>
    </select>
  </div>

  <div class="field">
    <label>Chapter *</label>
    <select id="chapter" required disabled>
      <option value="">Select Subject</option>
    </select>
  </div>

  <div class="field full">
    <label>Quiz Type *</label>
    <select id="type" required disabled>
      <option value="">Select Chapter</option>
    </select>
  </div>

</div>

<hr style="border-color:var(--border);margin:18px 0">

<div class="field">
  <label>Question Text</label>
  <textarea id="questionText"
    placeholder="Write question, mathematical signs, symbols or matching content..."></textarea>
</div>

<div class="field" style="margin-top:12px">
  <label>Question Diagram / Image</label>
  <input type="file" id="questionFile" accept="image/*">
  <div class="preview" id="questionPreview">
    <img id="questionPreviewImg" alt="Question preview">
    <button type="button" class="btn gray"
      onclick="clearImage('question')">Remove Image</button>
  </div>
</div>

<hr style="border-color:var(--border);margin:18px 0">

<h2>Answer Options</h2>

<div class="options">
  <div class="option">
    <label>Option A *</label>
    <textarea id="optionA" required></textarea>
  </div>
  <div class="option">
    <label>Option B *</label>
    <textarea id="optionB" required></textarea>
  </div>
  <div class="option">
    <label>Option C *</label>
    <textarea id="optionC" required></textarea>
  </div>
  <div class="option">
    <label>Option D *</label>
    <textarea id="optionD" required></textarea>
  </div>
</div>

<div class="grid" style="margin-top:14px">

  <div class="field">
    <label>Correct Answer *</label>
    <select id="answer" required>
      <option value="">Select</option>
      <option value="A">Option A</option>
      <option value="B">Option B</option>
      <option value="C">Option C</option>
      <option value="D">Option D</option>
    </select>
  </div>

  <div class="field">
    <label>Difficulty</label>
    <select id="difficulty">
      <option value="medium">Medium</option>
      <option value="easy">Easy</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div class="field">
    <label>Question Number *</label>
    <input id="order" type="number" min="1" value="1" required>
  </div>

  <div class="field">
    <label>Marks</label>
    <input id="marks" type="number" min="0" step="0.25" value="4">
  </div>

  <div class="field">
    <label>Negative Marks</label>
    <input id="negativeMarks" type="number" min="0" step="0.25" value="1">
  </div>

  <div class="field">
    <label>NCERT Reference</label>
    <input id="reference" placeholder="Optional">
  </div>

</div>

<div class="field" style="margin-top:14px">
  <label>Solution / Explanation</label>
  <textarea id="solution"
    placeholder="Optional"></textarea>
</div>

<div class="field" style="margin-top:12px">
  <label>Solution Diagram / Image</label>
  <input type="file" id="solutionFile" accept="image/*">
  <div class="preview" id="solutionPreview">
    <img id="solutionPreviewImg" alt="Solution preview">
    <button type="button" class="btn gray"
      onclick="clearImage('solution')">Remove Image</button>
  </div>
</div>

<div style="margin-top:14px">
  <label style="display:flex;align-items:center;gap:8px">
    <input type="checkbox" id="published" checked
      style="width:17px;height:17px">
    Publish Question
  </label>
</div>

<div class="progress" id="progress">
  <div class="track">
    <div class="bar" id="bar"></div>
  </div>
  <div class="progressText" id="progressText">Preparing...</div>
</div>

<div class="btnrow">
  <button class="btn green" id="saveBtn" type="submit">
    Save Question
  </button>

  <button class="btn gray" id="cancelBtn"
    type="button" hidden>
    Cancel Edit
  </button>
</div>

</form>
</section>

<section class="panel">
  <h2>📝 Existing Questions</h2>
  <div id="questionCount" class="small">0 Questions</div>
  <div id="questionList">
    <div class="empty">Select Subject, Chapter and Quiz Type.</div>
  </div>
</section>

</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>

<script src="js/firebase.js"></script>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

let subjects = [];
let chapters = [];
let types = [];
let questions = [];

let editingId = null;
let oldQuestionImage = "";
let oldSolutionImage = "";
let busy = false;
let initialized = false;

const form = $("questionForm");

function notice(message,type="info"){
  $("notice").textContent = message;
  $("notice").className = "notice " + type;
}

function clearNotice(){
  $("notice").textContent = "";
  $("notice").className = "notice";
}

function errorMessage(e){
  console.error(e);

  if(e.code === "permission-denied")
    return "Permission denied. Check Firestore Rules.";

  if(e.code === "storage/unauthorized")
    return "Storage permission denied. Check Storage Rules.";

  if(e.code === "storage/bucket-not-found")
    return "Storage bucket not found. Check Firebase configuration.";

  if(e.code === "storage/quota-exceeded")
    return "Firebase Storage quota exceeded.";

  if(e.code === "unavailable")
    return "Network problem. Try again.";

  return e.message || "Something went wrong.";
}

function clean(v){
  return String(v ?? "");
}

/* Theme */

function setTheme(){
  document.body.classList.toggle(
    "light",
    localStorage.getItem("mneetTheme") === "light"
  );
}

$("themeBtn").onclick = () => {
  localStorage.setItem(
    "mneetTheme",
    document.body.classList.contains("light") ? "dark" : "light"
  );
  setTheme();
};

setTheme();

/* Firestore paths */

function collection(subjectId,chapterId,typeId){
  return db.collection("subjects").doc(subjectId)
    .collection("chapters").doc(chapterId)
    .collection("quizTypes").doc(typeId)
    .collection("questions");
}

/* Select options */

function fillSelect(el,items,label,selected=""){
  el.replaceChildren();

  const first = document.createElement("option");
  first.value = "";
  first.textContent = label;
  el.appendChild(first);

  items.forEach(item=>{
    const op = document.createElement("option");
    op.value = item.id;
    op.textContent = item.name;
    el.appendChild(op);
  });

  el.value = items.some(x=>x.id === selected) ? selected : "";
}

/* Admin verification */

async function checkAdmin(user){
  if(!user){
    location.replace("index.html");
    return false;
  }

  const doc = await db.collection("users").doc(user.uid).get();

  if(
    !doc.exists ||
    doc.data().role !== "admin" ||
    doc.data().status === "disabled"
  ){
    alert("Admin access required.");
    await auth.signOut();
    location.replace("index.html");
    return false;
  }

  return true;
}

/* Load subjects */

async function loadSubjects(){
  const snap = await db.collection("subjects").get();

  subjects = snap.docs.map(d=>({
    id:d.id,
    name:clean(d.data().name) || "Unnamed Subject",
    order:Number(d.data().order) || 0
  }));

  subjects.sort((a,b)=>a.order-b.order);

  fillSelect($("subject"),subjects,"Select Subject");
}

/* Load chapters */

async function loadChapters(subjectId,selected=""){
  chapters = [];
  types = [];

  fillSelect($("chapter"),[],"Select Chapter");
  fillSelect($("type"),[],"Select Quiz Type");

  $("chapter").disabled = true;
  $("type").disabled = true;

  if(!subjectId) return;

  const snap = await db.collection("subjects")
    .doc(subjectId).collection("chapters").get();

  chapters = snap.docs.map(d=>({
    id:d.id,
    name:clean(d.data().name) || "Unnamed Chapter",
    order:Number(d.data().order) || 0
  }));

  chapters.sort((a,b)=>a.order-b.order);

  fillSelect($("chapter"),chapters,"Select Chapter",selected);
  $("chapter").disabled = false;

  if(selected){
    await loadTypes(subjectId,selected);
  }
}

/* Load quiz types */

async function loadTypes(subjectId,chapterId,selected=""){
  types = [];

  fillSelect($("type"),[],"Select Quiz Type");
  $("type").disabled = true;

  if(!subjectId || !chapterId) return;

  const snap = await db.collection("subjects")
    .doc(subjectId)
    .collection("chapters").doc(chapterId)
    .collection("quizTypes").get();

  types = snap.docs.map(d=>({
    id:d.id,
    name:clean(d.data().name) || "Unnamed Type",
    order:Number(d.data().order) || 0
  }));

  types.sort((a,b)=>a.order-b.order);

  fillSelect($("type"),types,"Select Quiz Type",selected);
  $("type").disabled = false;
}

/* Image compression */

async function compressImage(file){
  if(!file) return null;

  if(!file.type.startsWith("image/")){
    throw new Error("Select a valid image.");
  }

  if(file.size > 5*1024*1024){
    throw new Error("Image must be below 5 MB.");
  }

  if(file.type === "image/svg+xml"){
    return file;
  }

  const image = await createImageBitmap(file);

  const maxSide = 1800;
  const ratio = Math.min(
    1,
    maxSide / Math.max(image.width,image.height)
  );

  const canvas = document.createElement("canvas");
  canvas.width = Math.round(image.width*ratio);
  canvas.height = Math.round(image.height*ratio);

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(image,0,0,canvas.width,canvas.height);

  image.close();

  let quality = 0.88;
  let blob = await new Promise(resolve=>
    canvas.toBlob(resolve,"image/webp",quality)
  );

  while(blob && blob.size > 350*1024 && quality > 0.45){
    quality -= 0.08;

    blob = await new Promise(resolve=>
      canvas.toBlob(resolve,"image/webp",quality)
    );
  }

  if(!blob){
    throw new Error("Image compression failed.");
  }

  return new File(
    [blob],
    "question.webp",
    {type:"image/webp"}
  );
}

/* Preview */

function previewFile(file,type){
  if(!file) return;

  const prefix = type === "question" ? "question" : "solution";

  const img = $(prefix+"PreviewImg");
  const box = $(prefix+"Preview");

  if(img.dataset.url){
    URL.revokeObjectURL(img.dataset.url);
  }

  const url = URL.createObjectURL(file);
  img.src = url;
  img.dataset.url = url;
  box.style.display = "block";
}

function clearImage(type){
  const prefix = type === "question" ? "question" : "solution";

  $(prefix+"File").value = "";

  const img = $(prefix+"PreviewImg");

  if(img.dataset.url){
    URL.revokeObjectURL(img.dataset.url);
  }

  img.removeAttribute("src");
  delete img.dataset.url;

  $(prefix+"Preview").style.display = "none";
}

$("questionFile").addEventListener("change",()=>{
  const f = $("questionFile").files[0];
  if(f) previewFile(f,"question");
});

$("solutionFile").addEventListener("change",()=>{
  const f = $("solutionFile").files[0];
  if(f) previewFile(f,"solution");
});

/* Image upload */

async function uploadImage(file,path,label){
  const compressed = await compressImage(file);

  const ref = firebase.storage().ref().child(path);

  const task = ref.put(compressed,{
    contentType:compressed.type,
    cacheControl:"public,max-age=31536000"
  });

  return new Promise((resolve,reject)=>{

    task.on("state_changed",snapshot=>{

      const percent = snapshot.totalBytes
        ? Math.round(snapshot.bytesTransferred /
          snapshot.totalBytes * 100)
        : 0;

      $("progress").style.display = "block";
      $("bar").style.width = percent+"%";
      $("progressText").textContent =
        label+" uploading: "+percent+"%";

    },reject,async()=>{

      try{
        resolve(await task.snapshot.ref.getDownloadURL());
      }catch(e){
        reject(e);
      }

    });

  });
}

/* Load questions only for selected Quiz Type */

async function loadQuestions(){

  const subjectId = $("subject").value;
  const chapterId = $("chapter").value;
  const typeId = $("type").value;

  questions = [];

  if(!subjectId || !chapterId || !typeId){
    $("questionList").innerHTML =
      '<div class="empty">Select Subject, Chapter and Quiz Type.</div>';
    $("questionCount").textContent = "0 Questions";
    return;
  }

  $("questionList").innerHTML =
    '<div class="empty">Loading...</div>';

  try{

    const snap = await collection(
      subjectId,chapterId,typeId
    ).get();

    questions = snap.docs.map(d=>{
      const x = d.data();

      return {
        id:d.id,
        text:clean(x.text),
        imageUrl:clean(x.imageUrl),
        options:x.options || {},
        correctAnswer:clean(x.correctAnswer),
        solution:clean(x.solution),
        solutionImageUrl:clean(x.solutionImageUrl),
        ncertReference:clean(x.ncertReference),
        difficulty:clean(x.difficulty || "medium"),
        order:Number(x.order) || 1,
        marks:Number(x.marks ?? 4),
        negativeMarks:Number(x.negativeMarks ?? 1),
        published:x.published === true
      };
    });

    questions.sort((a,b)=>a.order-b.order);

    renderQuestions();

  }catch(e){
    $("questionList").innerHTML =
      '<div class="empty">Could not load questions.</div>';
    notice(errorMessage(e),"error");
  }
}

/* Render questions */

function renderQuestions(){

  $("questionCount").textContent =
    questions.length+" Questions";

  const list = $("questionList");
  list.replaceChildren();

  if(!questions.length){
    list.innerHTML =
      '<div class="empty">No questions added yet.</div>';
    return;
  }

  questions.forEach(q=>{

    const card = document.createElement("article");
    card.className = "question";

    const head = document.createElement("div");
    head.className = "questionHead";

    const title = document.createElement("div");
    title.className = "questionText";
    title.textContent =
      "Q"+q.order+". "+(q.text || "[Image Question]");

    const badge = document.createElement("span");
    badge.className = "badge "+(q.published?"on":"off");
    badge.textContent = q.published?"PUBLISHED":"UNPUBLISHED";

    head.append(title,badge);
    card.append(head);

    if(q.imageUrl){
      const img = document.createElement("img");
      img.className = "qimg";
      img.loading = "lazy";
      img.src = q.imageUrl;
      img.alt = "Question";
      card.append(img);
    }

    const opts = document.createElement("div");
    opts.className = "qoptions";

    ["A","B","C","D"].forEach(letter=>{
      const line = document.createElement("div");
      line.textContent =
        letter+". "+clean(q.options[letter]);

      if(letter===q.correctAnswer){
        line.style.color="#22c55e";
        line.style.fontWeight="bold";
      }

      opts.append(line);
    });

    card.append(opts);

    if(q.solution){
      const sol = document.createElement("div");
      sol.className = "qmeta";
      sol.textContent = "Solution: "+q.solution;
      card.append(sol);
    }

    if(q.solutionImageUrl){
      const img = document.createElement("img");
      img.className = "qimg";
      img.loading = "lazy";
      img.src = q.solutionImageUrl;
      img.alt = "Solution";
      card.append(img);
    }

    const meta = document.createElement("div");
    meta.className = "qmeta";
    meta.textContent =
      "Difficulty: "+q.difficulty+
      " | Marks: "+q.marks+
      " | Negative: "+q.negativeMarks;
    card.append(meta);

    const actions = document.createElement("div");
    actions.className = "qactions";

    const edit = document.createElement("button");
    edit.className = "btn yellow";
    edit.textContent = "Edit";
    edit.onclick = ()=>editQuestion(q);

    const publish = document.createElement("button");
    publish.className = "btn gray";
    publish.textContent = q.published?"Unpublish":"Publish";
    publish.onclick = ()=>togglePublish(q);

    const del = document.createElement("button");
    del.className = "btn red";
    del.textContent = "Delete";
    del.onclick = ()=>deleteQuestion(q);

    actions.append(edit,publish,del);
    card.append(actions);

    list.append(card);
  });
}

/* Reset only question fields */

function resetForm(){

  editingId = null;
  oldQuestionImage = "";
  oldSolutionImage = "";

  $("questionText").value = "";

  ["A","B","C","D"].forEach(x=>{
    $("option"+x).value = "";
  });

  $("answer").value = "";
  $("difficulty").value = "medium";
  $("order").value = questions.length+1;
  $("marks").value = 4;
  $("negativeMarks").value = 1;
  $("reference").value = "";
  $("solution").value = "";
  $("published").checked = true;

  clearImage("question");
  clearImage("solution");

  $("formTitle").textContent = "➕ Add Question";
  $("saveBtn").textContent = "Save Question";
  $("cancelBtn").hidden = true;

  $("subject").disabled = false;
  $("chapter").disabled = false;
  $("type").disabled = false;

  $("progress").style.display = "none";
  $("bar").style.width = "0%";
}

/* Edit */

async function editQuestion(q){

  if(busy) return;

  try{

    editingId = q.id;
    oldQuestionImage = q.imageUrl;
    oldSolutionImage = q.solutionImageUrl;

    const s = $("subject").value;
    const c = $("chapter").value;
    const t = $("type").value;

    $("questionText").value = q.text;

    ["A","B","C","D"].forEach(x=>{
      $("option"+x).value = clean(q.options[x]);
    });

    $("answer").value = q.correctAnswer;
    $("difficulty").value = q.difficulty;
    $("order").value = q.order;
    $("marks").value = q.marks;
    $("negativeMarks").value = q.negativeMarks;
    $("reference").value = q.ncertReference;
    $("solution").value = q.solution;
    $("published").checked = q.published;

    clearImage("question");
    clearImage("solution");

    if(q.imageUrl){
      $("questionPreviewImg").src = q.imageUrl;
      $("questionPreview").style.display = "block";
    }

    if(q.solutionImageUrl){
      $("solutionPreviewImg").src = q.solutionImageUrl;
      $("solutionPreview").style.display = "block";
    }

    $("subject").disabled = true;
    $("chapter").disabled = true;
    $("type").disabled = true;

    $("formTitle").textContent = "✏️ Edit Question";
    $("saveBtn").textContent = "Update Question";
    $("cancelBtn").hidden = false;

    window.scrollTo({top:0,behavior:"smooth"});

  }catch(e){
    notice(errorMessage(e),"error");
  }
}

/* Save */

async function saveQuestion(event){

  event.preventDefault();

  if(busy) return;

  clearNotice();

  const subjectId = $("subject").value;
  const chapterId = $("chapter").value;
  const typeId = $("type").value;

  const text = $("questionText").value.trim();

  const questionFile = $("questionFile").files[0];
  const solutionFile = $("solutionFile").files[0];

  if(!subjectId || !chapterId || !typeId){
    notice("Select Subject, Chapter and Quiz Type.","error");
    return;
  }

  if(!text && !questionFile && !oldQuestionImage){
    notice("Enter question text or select an image.","error");
    return;
  }

  const options = {
    A:$("optionA").value.trim(),
    B:$("optionB").value.trim(),
    C:$("optionC").value.trim(),
    D:$("optionD").value.trim()
  };

  if(Object.values(options).some(x=>!x)){
    notice("All four options are required.","error");
    return;
  }

  const answer = $("answer").value;

  if(!["A","B","C","D"].includes(answer)){
    notice("Select correct answer.","error");
    return;
  }

  const order = Number($("order").value);
  const marks = Number($("marks").value);
  const negative = Number($("negativeMarks").value);

  if(!Number.isInteger(order) || order<1){
    notice("Enter a valid question number.","error");
    return;
  }

  if(!Number.isFinite(marks) || marks<0 ||
     !Number.isFinite(negative) || negative<0){
    notice("Enter valid marks.","error");
    return;
  }

  busy = true;
  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "Saving...";

  try{

    const ref = collection(
      subjectId,chapterId,typeId
    ).doc(editingId || undefined);

    let imageUrl = oldQuestionImage;
    let solutionImageUrl = oldSolutionImage;

    const basePath =
      "questions/"+subjectId+"/"+chapterId+"/"+typeId+"/"+ref.id+"/";

    /* Upload both images together */

    const uploads = [];

    if(questionFile){
      uploads.push(
        uploadImage(
          questionFile,
          basePath+"question_"+Date.now(),
          "Question Image"
        ).then(url=>{imageUrl=url;})
      );
    }

    if(solutionFile){
      uploads.push(
        uploadImage(
          solutionFile,
          basePath+"solution_"+Date.now(),
          "Solution Image"
        ).then(url=>{solutionImageUrl=url;})
      );
    }

    await Promise.all(uploads);

    $("progressText").textContent = "Saving question...";

    const payload = {
      text,
      imageUrl,
      options,
      correctAnswer:answer,
      solution:$("solution").value.trim(),
      solutionImageUrl,
      ncertReference:$("reference").value.trim(),
      difficulty:$("difficulty").value,
      order,
      marks,
      negativeMarks:negative,
      published:$("published").checked,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    if(editingId){
      await ref.update(payload);
    }else{
      payload.createdAt =
        firebase.firestore.FieldValue.serverTimestamp();

      await ref.set(payload);
    }

    notice(
      editingId?"Question updated successfully.":"Question saved successfully.",
      "success"
    );

    resetForm();

    await loadQuestions();

    $("order").value = questions.length+1;

  }catch(e){
    notice("Save failed: "+errorMessage(e),"error");
  }finally{
    busy = false;
    $("saveBtn").disabled = false;
    $("saveBtn").textContent =
      editingId?"Update Question":"Save Question";
  }
}

/* Publish */

async function togglePublish(q){

  if(busy) return;

  if(!confirm("Change question publish status?")) return;

  busy = true;

  try{

    await collection(
      $("subject").value,
      $("chapter").value,
      $("type").value
    ).doc(q.id).update({
      published:!q.published,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    notice("Publish status updated.","success");
    await loadQuestions();

  }catch(e){
    notice(errorMessage(e),"error");
  }finally{
    busy = false;
  }
}

/* Delete */

async function deleteQuestion(q){

  if(busy) return;

  if(!confirm("Delete Question "+q.order+" permanently?")) return;

  busy = true;

  try{

    await collection(
      $("subject").value,
      $("chapter").value,
      $("type").value
    ).doc(q.id).delete();

    if(editingId===q.id) resetForm();

    notice("Question deleted.","success");
    await loadQuestions();

  }catch(e){
    notice(errorMessage(e),"error");
  }finally{
    busy = false;
  }
}

/* Events */

$("subject").addEventListener("change",async()=>{
  clearNotice();
  await loadChapters($("subject").value);
  await loadQuestions();
});

$("chapter").addEventListener("change",async()=>{
  clearNotice();
  await loadTypes($("subject").value,$("chapter").value);
  await loadQuestions();
});

$("type").addEventListener("change",async()=>{
  clearNotice();
  await loadQuestions();
  $("order").value = questions.length+1;
});

form.addEventListener("submit",saveQuestion);

$("cancelBtn").onclick = ()=>{
  if(busy) return;
  resetForm();
  clearNotice();
};

$("logoutBtn").onclick = async()=>{
  try{
    await auth.signOut();
    location.replace("index.html");
  }catch(e){
    notice(errorMessage(e),"error");
  }
};

/* Initialise */

auth.onAuthStateChanged(async user=>{

  if(initialized) return;
  initialized = true;

  try{

    if(!await checkAdmin(user)) return;

    if(!firebase.storage){
      throw new Error("Firebase Storage SDK not loaded.");
    }

    await loadSubjects();

  }catch(e){
    notice("Initialisation failed: "+errorMessage(e),"error");
  }

});

})();
</script>
