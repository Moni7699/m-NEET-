
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Manage Questions | mNEET Admin</title>

<style>
:root{
  --bg:#101827;
  --card:#192538;
  --input:#101827;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#334155;
  --yellow:#ffc107;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#3b82f6;
}
body.light{
  --bg:#f1f5f9;
  --card:#ffffff;
  --input:#f8fafc;
  --text:#172033;
  --muted:#64748b;
  --border:#cbd5e1;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
header h2{font-size:18px;margin:0}
button,a{
  cursor:pointer;
  font:inherit;
}
button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:600;
}
.btn-yellow{background:var(--yellow);color:#111827}
.btn-dark{background:#334155;color:white}
.btn-red{background:var(--red);color:white}
.btn-green{background:var(--green);color:#052e16}
.btn-blue{background:var(--blue);color:white}
.btn-small{padding:7px 10px;font-size:12px}
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
}
h3{margin:0 0 15px;font-size:17px}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:13px 0 6px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  font-size:14px;
}
textarea{
  min-height:90px;
  resize:vertical;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--yellow);
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.hidden{display:none!important}
.notice{
  padding:11px;
  border-radius:8px;
  margin-bottom:12px;
  font-size:13px;
  display:none;
}
.notice.success{background:#14532d;color:#dcfce7;display:block}
.notice.error{background:#7f1d1d;color:#fee2e2;display:block}
.notice.info{background:#1e3a8a;color:#dbeafe;display:block}
.muted{color:var(--muted);font-size:12px}
.preview{
  display:block;
  max-width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:8px;
  margin-top:10px;
  border:1px solid var(--border);
}
.section-title{
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
  margin-top:22px;
}
.question-card{
  background:var(--card);
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
  margin-bottom:12px;
}
.question-card p{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.question-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:10px;
}
.tag{
  font-size:11px;
  padding:5px 8px;
  border-radius:20px;
  background:#334155;
  color:white;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}
.top-actions{
  display:flex;
  gap:7px;
  align-items:center;
}
#questionList{margin-top:12px}
.pagination{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
}
.pagination span{font-size:13px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  header h2{font-size:15px}
  .container{padding:10px}
}
</style>
</head>

<body>

<header>
  <h2>mNEET | Manage Questions</h2>
  <div class="top-actions">
    <button class="btn-dark btn-small" id="themeBtn">Theme</button>
    <a href="admin.html" style="color:var(--yellow);font-size:13px">Admin</a>
  </div>
</header>

<div class="container">

  <div id="notice" class="notice"></div>

  <section class="card">
    <h3>Question Location</h3>

    <div class="grid">
      <div>
        <label>Subject</label>
        <select id="subjectSelect">
          <option value="">Select Subject</option>
        </select>
      </div>

      <div>
        <label>Chapter</label>
        <select id="chapterSelect" disabled>
          <option value="">Select Chapter</option>
        </select>
      </div>

      <div>
        <label>Question Type</label>
        <select id="typeSelect" disabled>
          <option value="">Select Question Type</option>
        </select>
      </div>
    </div>
  </section>

  <section class="card" id="editorCard">
    <h3 id="formHeading">Add New Question</h3>

    <form id="questionForm">

      <div id="dynamicFields"></div>

      <h3 class="section-title">Question Settings</h3>

      <div class="grid">
        <div>
          <label>Question Order</label>
          <input type="number" id="questionOrder" min="1" required>
        </div>

        <div>
          <label>Difficulty</label>
          <select id="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>

        <div>
          <label>Marks</label>
          <input type="number" id="marks" value="4" step="0.5">
        </div>

        <div>
          <label>Negative Marks</label>
          <input type="number" id="negativeMarks" value="1" step="0.25">
        </div>

        <div>
          <label>NCERT Reference</label>
          <input type="text" id="ncertReference" placeholder="Example: Page 25">
        </div>

        <div id="pyqYearWrap" class="hidden">
          <label>PYQ Year</label>
          <input type="number" id="pyqYear" min="2000" max="2035" placeholder="Example: 2024">
        </div>
      </div>

      <label>Solution / Explanation</label>
      <textarea id="solution" placeholder="Write detailed explanation..."></textarea>

      <label>Solution Image URL (Optional)</label>
      <input type="url" id="solutionImageUrl" placeholder="https://example.com/solution.jpg">
      <img id="solutionPreview" class="preview hidden" alt="Solution preview">

      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="published" checked style="width:auto">
        Publish Question
      </label>

      <div class="actions">
        <button type="submit" class="btn-yellow" id="saveBtn">Save Question</button>
        <button type="button" class="btn-dark" id="cancelBtn">Cancel Edit</button>
        <button type="button" class="btn-dark" id="resetBtn">Reset Form</button>
      </div>

    </form>
  </section>

  <section class="card">
    <h3>Question Management</h3>

    <div class="grid">
      <div>
        <label>Search Questions</label>
        <input type="search" id="searchInput" placeholder="Search question text...">
      </div>
      <div>
        <label>Publication Filter</label>
        <select id="statusFilter">
          <option value="all">All Questions</option>
          <option value="published">Published</option>
          <option value="unpublished">Unpublished</option>
        </select>
      </div>
    </div>

    <p class="muted" id="countLabel">Loading questions...</p>
    <div id="questionList"></div>

    <div class="pagination">
      <button class="btn-dark btn-small" id="prevBtn">Previous</button>
      <span id="pageLabel">Page 1</span>
      <button class="btn-dark btn-small" id="nextBtn">Next</button>
    </div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>

<script>
"use strict";

/* =========================================
   mNEET QUESTION MANAGER
   Firestore:
   subjects/{subjectId}/chapters/{chapterId}/quizTypes/{typeId}/questions/{questionId}
========================================= */

const $ = id => document.getElementById(id);

const PAGE_SIZE = 180;

let currentUser = null;
let allQuestions = [];
let editingId = null;
let editingPath = null;
let page = 1;
let loadSequence = 0;
let saving = false;

let subjectsCache = [];
let chaptersCache = [];
let typesCache = [];

function showNotice(message,type="info"){
  const box=$("notice");
  box.textContent=message;
  box.className="notice "+type;
  window.scrollTo({top:0,behavior:"smooth"});
}

function clearNotice(){
  $("notice").className="notice";
  $("notice").textContent="";
}

function safeText(value){
  return String(value ?? "");
}

function normalize(value){
  return safeText(value).toLowerCase().replace(/[^a-z0-9]/g,"");
}

function selectedTypeName(){
  const option=$("typeSelect").selectedOptions[0];
  return option ? option.textContent.trim() : "";
}

function isFillBlank(type){
  const t=normalize(type);
  return t.includes("fill") && (t.includes("blank") || t.includes("blanks"));
}

function isAssertionReason(type){
  const t=normalize(type);
  return t.includes("assertion") && t.includes("reason");
}

function isMatching(type){
  const t=normalize(type);
  return t.includes("match") || t.includes("matching");
}

function isStatement(type){
  const t=normalize(type);
  return t.includes("statement");
}

function isCorrectIncorrect(type){
  const t=normalize(type);
  return t.includes("correctincorrect") ||
         t.includes("truefalse") ||
         t.includes("correctwrong");
}

function isDiagram(type){
  return normalize(type).includes("diagram");
}

function isPYQ(type){
  return normalize(type).includes("pyq") ||
         normalize(type).includes("previousyear");
}

function isMCQType(type){
  return !isFillBlank(type);
}

/* =========================================
   DYNAMIC QUESTION FORM
========================================= */

function field(label,id,placeholder="",tag="textarea"){
  const wrapper=document.createElement("div");
  const lab=document.createElement("label");
  lab.textContent=label;
  wrapper.appendChild(lab);

  const el=document.createElement(tag);
  el.id=id;
  el.placeholder=placeholder;

  if(tag==="input") el.type="text";
  wrapper.appendChild(el);
  return wrapper;
}

function makeInput(label,id,placeholder=""){
  const wrapper=field(label,id,placeholder,"input");
  return wrapper;
}

function makeTextarea(label,id,placeholder=""){
  return field(label,id,placeholder,"textarea");
}

function makeImageField(label,id,previewId){
  const wrapper=document.createElement("div");

  const lab=document.createElement("label");
  lab.textContent=label;
  wrapper.appendChild(lab);

  const input=document.createElement("input");
  input.type="url";
  input.id=id;
  input.placeholder="https://example.com/image.jpg";
  wrapper.appendChild(input);

  const help=document.createElement("p");
  help.className="muted";
  help.textContent="Paste a publicly accessible image URL. No gallery upload.";
  wrapper.appendChild(help);

  const img=document.createElement("img");
  img.id=previewId;
  img.className="preview hidden";
  img.alt=label;
  wrapper.appendChild(img);

  input.addEventListener("input",()=>updatePreview(input,img));

  return wrapper;
}

function updatePreview(input,img){
  const url=input.value.trim();
  if(!url){
    img.classList.add("hidden");
    img.removeAttribute("src");
    return;
  }

  try{
    const parsed=new URL(url);
    if(parsed.protocol!=="https:" && parsed.protocol!=="http:"){
      throw new Error("Invalid URL");
    }
    img.src=url;
    img.classList.remove("hidden");
    img.onerror=()=>img.classList.add("hidden");
  }catch(e){
    img.classList.add("hidden");
  }
}

function makeOptions(){
  const wrapper=document.createElement("div");
  wrapper.id="optionsSection";

  const heading=document.createElement("h3");
  heading.className="section-title";
  heading.textContent="Answer Options";
  wrapper.appendChild(heading);

  ["A","B","C","D"].forEach(letter=>{
    const lab=document.createElement("label");
    lab.textContent="Option "+letter;
    wrapper.appendChild(lab);

    const input=document.createElement("textarea");
    input.id="option"+letter;
    input.placeholder="Write option "+letter;
    input.style.minHeight="60px";
    wrapper.appendChild(input);
  });

  const lab=document.createElement("label");
  lab.textContent="Correct Answer";
  wrapper.appendChild(lab);

  const select=document.createElement("select");
  select.id="correctAnswer";
  select.innerHTML=
    '<option value="">Select Correct Option</option>'+
    '<option value="A">Option A</option>'+
    '<option value="B">Option B</option>'+
    '<option value="C">Option C</option>'+
    '<option value="D">Option D</option>';
  wrapper.appendChild(select);

  return wrapper;
}

function makeDirectAnswer(){
  const wrapper=document.createElement("div");
  wrapper.id="directAnswerSection";

  const lab=document.createElement("label");
  lab.textContent="Correct Answer";
  wrapper.appendChild(lab);

  const input=document.createElement("textarea");
  input.id="directAnswer";
  input.placeholder="Write the exact answer. No options are needed.";
  wrapper.appendChild(input);

  const help=document.createElement("p");
  help.className="muted";
  help.textContent="Fill in the Blanks uses a direct answer instead of MCQ options.";
  wrapper.appendChild(help);

  return wrapper;
}

function renderDynamicForm(){
  const type=selectedTypeName();
  const root=$("dynamicFields");
  root.replaceChildren();

  if(!type) return;

  $("pyqYearWrap").classList.toggle("hidden",!isPYQ(type));

  if(isFillBlank(type)){
    root.appendChild(makeTextarea(
      "Fill in the Blanks Question",
      "questionText",
      "Example: The fluid mosaic model was proposed by..."
    ));
    root.appendChild(makeDirectAnswer());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }
  else if(isAssertionReason(type)){
    root.appendChild(makeTextarea(
      "Assertion (A)",
      "assertion",
      "Write the assertion statement..."
    ));
    root.appendChild(makeTextarea(
      "Reason (R)",
      "reason",
      "Write the reason statement..."
    ));
    root.appendChild(makeOptions());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }
  else if(isMatching(type)){
    root.appendChild(makeTextarea(
      "Column I",
      "columnOne",
      "1. First item\n2. Second item\n3. Third item\n4. Fourth item"
    ));
    root.appendChild(makeTextarea(
      "Column II",
      "columnTwo",
      "i. First match\nii. Second match\niii. Third match\niv. Fourth match"
    ));
    root.appendChild(makeOptions());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }
  else if(isStatement(type)){
    root.appendChild(makeTextarea(
      "Statements / Question",
      "questionText",
      "Write statements I, II, III, IV and the question..."
    ));
    root.appendChild(makeOptions());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }
  else if(isCorrectIncorrect(type)){
    root.appendChild(makeTextarea(
      "Statement / Question",
      "questionText",
      "Write the statement and ask whether it is correct or incorrect..."
    ));
    root.appendChild(makeOptions());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }
  else if(isDiagram(type)){
    root.appendChild(makeTextarea(
      "Diagram Based Question",
      "questionText",
      "Write the question related to the diagram..."
    ));
    root.appendChild(makeImageField(
      "Diagram Image URL",
      "questionImageUrl",
      "Paste diagram image URL..."
    ));
    root.appendChild(makeOptions());
  }
  else if(isPYQ(type)){
    root.appendChild(makeTextarea(
      "Previous Year Question",
      "questionText",
      "Write the PYQ question..."
    ));
    root.appendChild(makeOptions());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }
  else{
    root.appendChild(makeTextarea(
      "Question Text",
      "questionText",
      "Write your question..."
    ));
    root.appendChild(makeOptions());
    root.appendChild(makeImageField(
      "Question Image URL (Optional)",
      "questionImageUrl",
      "questionPreview"
    ));
  }

  root.appendChild(makeTextarea(
    "Additional Question Instructions (Optional)",
    "questionInstructions",
    "Any additional information..."
  ));

  if(editingId) populateDynamicForm(editingQuestionData);
}

let editingQuestionData=null;

function populateDynamicForm(data){
  if(!data) return;

  const type=selectedTypeName();

  if(isAssertionReason(type)){
    setValue("assertion",data.assertion);
    setValue("reason",data.reason);
  }
  else if(isMatching(type)){
    setValue("columnOne",data.columnOne);
    setValue("columnTwo",data.columnTwo);
  }
  else{
    setValue("questionText",data.questionText || data.text);
  }

  setValue("questionInstructions",data.questionInstructions);
  setValue("questionImageUrl",data.imageUrl);
  setValue("directAnswer",data.correctAnswer);

  const options=data.options || {};
  ["A","B","C","D"].forEach(letter=>{
    setValue("option"+letter,options[letter] || "");
  });

  if($("correctAnswer")){
    $("correctAnswer").value=data.correctAnswer || "";
  }

  const image=$("questionPreview");
  if(image) updatePreview($("questionImageUrl"),image);
}

function setValue(id,value){
  const element=$(id);
  if(element) element.value=safeText(value);
}

function getValue(id){
  const element=$(id);
  return element ? element.value.trim() : "";
}

$("typeSelect").addEventListener("change",()=>{
  editingQuestionData=null;
  renderDynamicForm();
  if(editingId){
    editingQuestionData=allQuestions.find(q=>q.id===editingId)?.data || null;
    populateDynamicForm(editingQuestionData);
  }
});

/* =========================================
   THEME
========================================= */

if(localStorage.getItem("mneetTheme")==="light"){
  document.body.classList.add("light");
}

$("themeBtn").addEventListener("click",()=>{
  document.body.classList.toggle("light");
  localStorage.setItem(
    "mneetTheme",
    document.body.classList.contains("light")?"light":"dark"
  );
});

/* =========================================
   FIREBASE AUTH
========================================= */

auth.onAuthStateChanged(async user=>{
  if(!user){
    location.href="index.html";
    return;
  }

  try{
    const profile=await db.collection("users").doc(user.uid).get();

    if(!profile.exists ||
       profile.data().role!=="admin" ||
       profile.data().status==="disabled"){
      showNotice("Admin access denied.","error");
      await auth.signOut();
      location.href="index.html";
      return;
    }

    currentUser=user;
    await loadSubjects();

  }catch(error){
    console.error(error);
    showNotice("Admin verification failed: "+error.message,"error");
  }
});

/* =========================================
   LOAD SUBJECTS / CHAPTERS / TYPES
========================================= */

async function loadSubjects(){
  try{
    const snap=await db.collection("subjects").get();
    subjectsCache=snap.docs.map(doc=>({
      id:doc.id,
      name:doc.data().name || doc.id
    }));

    fillSelect($("subjectSelect"),subjectsCache,"Select Subject");
  }catch(error){
    showNotice("Could not load subjects: "+error.message,"error");
  }
}

function fillSelect(select,items,placeholder){
  select.replaceChildren();
  const first=document.createElement("option");
  first.value="";
  first.textContent=placeholder;
  select.appendChild(first);

  items.forEach(item=>{
    const option=document.createElement("option");
    option.value=item.id;
    option.textContent=item.name;
    select.appendChild(option);
  });
}

$("subjectSelect").addEventListener("change",async()=>{
  $("chapterSelect").disabled=true;
  $("typeSelect").disabled=true;
  chaptersCache=[];
  typesCache=[];
  allQuestions=[];
  renderQuestions();

  const subjectId=$("subjectSelect").value;
  if(!subjectId) return;

  try{
    const snap=await db.collection("subjects")
      .doc(subjectId)
      .collection("chapters")
      .get();

    chaptersCache=snap.docs.map(doc=>({
      id:doc.id,
      name:doc.data().name || doc.id
    }));

    fillSelect($("chapterSelect"),chaptersCache,"Select Chapter");
    $("chapterSelect").disabled=false;
  }catch(error){
    showNotice("Chapter loading failed: "+error.message,"error");
  }
});

$("chapterSelect").addEventListener("change",async()=>{
  $("typeSelect").disabled=true;
  typesCache=[];
  allQuestions=[];
  renderQuestions();

  const subjectId=$("subjectSelect").value;
  const chapterId=$("chapterSelect").value;
  if(!subjectId || !chapterId) return;

  try{
    const snap=await db.collection("subjects")
      .doc(subjectId)
      .collection("chapters")
      .doc(chapterId)
      .collection("quizTypes")
      .get();

    typesCache=snap.docs.map(doc=>({
      id:doc.id,
      name:doc.data().name || doc.data().title || doc.id
    }));

    fillSelect($("typeSelect"),typesCache,"Select Question Type");
    $("typeSelect").disabled=false;
  }catch(error){
    showNotice("Question types loading failed: "+error.message,"error");
  }
});

$("typeSelect").addEventListener("change",async()=>{
  resetForm(false);
  renderDynamicForm();
  await loadQuestions();
});

/* =========================================
   QUESTION PATH
========================================= */

function questionCollection(){
  const subjectId=$("subjectSelect").value;
  const chapterId=$("chapterSelect").value;
  const typeId=$("typeSelect").value;

  if(!subjectId || !chapterId || !typeId) return null;

  return db.collection("subjects").doc(subjectId)
    .collection("chapters").doc(chapterId)
    .collection("quizTypes").doc(typeId)
    .collection("questions");
}

function getPath(){
  const subjectId=$("subjectSelect").value;
  const chapterId=$("chapterSelect").value;
  const typeId=$("typeSelect").value;

  return {
    subjectId,
    chapterId,
    typeId
  };
}

/* =========================================
   LOAD QUESTIONS
========================================= */

async function loadQuestions(){
  const sequence=++loadSequence;
  const collection=questionCollection();

  if(!collection){
    allQuestions=[];
    renderQuestions();
    return;
  }

  $("questionList").textContent="Loading questions...";

  try{
    const snap=await collection.orderBy("order","asc").get();

    if(sequence!==loadSequence) return;

    allQuestions=snap.docs.map(doc=>({
      id:doc.id,
      data:doc.data(),
      path:getPath()
    }));

    renderQuestions();

  }catch(error){
    console.error(error);
    if(sequence===loadSequence){
      $("questionList").textContent="Could not load questions.";
      showNotice("Question loading failed: "+error.message,"error");
    }
  }
}

/* =========================================
   BUILD QUESTION DATA
========================================= */

function buildQuestionData(){
  const type=selectedTypeName();
  const fillBlank=isFillBlank(type);

  let text="";
  let assertion="";
  let reason="";
  let columnOne="";
  let columnTwo="";

  if(isAssertionReason(type)){
    assertion=getValue("assertion");
    reason=getValue("reason");
    text="Assertion: "+assertion+"\nReason: "+reason;

    if(!assertion || !reason){
      throw new Error("Enter both Assertion and Reason.");
    }
  }
  else if(isMatching(type)){
    columnOne=getValue("columnOne");
    columnTwo=getValue("columnTwo");
    text="Column I:\n"+columnOne+"\n\nColumn II:\n"+columnTwo;

    if(!columnOne || !columnTwo){
      throw new Error("Enter both Column I and Column II.");
    }
  }
  else{
    text=getValue("questionText");
  }

  const imageUrl=getValue("questionImageUrl");

  if(!text && !imageUrl){
    throw new Error("Enter question text or a question image URL.");
  }

  let options={};
  let correctAnswer="";

  if(fillBlank){
    correctAnswer=getValue("directAnswer");
    if(!correctAnswer){
      throw new Error("Enter the correct answer for Fill in the Blanks.");
    }
  }
  else{
    ["A","B","C","D"].forEach(letter=>{
      options[letter]=getValue("option"+letter);
    });

    if(Object.values(options).some(value=>!value)){
      throw new Error("Please fill all four options.");
    }

    correctAnswer=getValue("correctAnswer");

    if(!["A","B","C","D"].includes(correctAnswer)){
      throw new Error("Select the correct option.");
    }
  }

  const order=Number($("questionOrder").value);
  const marks=Number($("marks").value);
  const negativeMarks=Number($("negativeMarks").value);

  if(!Number.isInteger(order) || order<1){
    throw new Error("Question order must be a positive whole number.");
  }

  if(!Number.isFinite(marks) || marks<0 ||
     !Number.isFinite(negativeMarks) || negativeMarks<0){
    throw new Error("Marks must be valid non-negative numbers.");
  }

  const data={
    text,
    questionText:text,
    questionType:type,
    typeName:type,
    options:fillBlank?{}:options,
    correctAnswer,
    assertion,
    reason,
    columnOne,
    columnTwo,
    questionInstructions:getValue("questionInstructions"),
    imageUrl,
    solution:getValue("solution"),
    solutionImageUrl:getValue("solutionImageUrl"),
    ncertReference:getValue("ncertReference"),
    difficulty:$("difficulty").value,
    order,
    marks,
    negativeMarks,
    published:$("published").checked,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };

  if(isPYQ(type)){
    const year=Number($("pyqYear").value);
    if(!Number.isInteger(year) || year<2000 || year>2035){
      throw new Error("Enter a valid PYQ year.");
    }
    data.pyqYear=year;
    data.year=year;
  }

  if(!editingId){
    data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  }

  return data;
}

/* =========================================
   SAVE QUESTION
========================================= */

$("questionForm").addEventListener("submit",async event=>{
  event.preventDefault();
  clearNotice();

  if(saving) return;

  const collection=questionCollection();
  if(!collection){
    showNotice("Select Subject, Chapter and Question Type first.","error");
    return;
  }

  let data;
  try{
    data=buildQuestionData();
  }catch(error){
    showNotice(error.message,"error");
    return;
  }

  saving=true;
  $("saveBtn").disabled=true;
  $("saveBtn").textContent="Saving...";

  try{
    const duplicate=await collection
      .where("order","==",data.order)
      .get();

    const duplicateExists=duplicate.docs.some(doc=>doc.id!==editingId);

    if(duplicateExists){
      throw new Error("This question order already exists. Choose another order.");
    }

    if(editingId && editingPath){
      const oldPath=editingPath;
      const newPath=getPath();

      if(oldPath.subjectId!==newPath.subjectId ||
         oldPath.chapterId!==newPath.chapterId ||
         oldPath.typeId!==newPath.typeId){
        throw new Error("The question location changed. Cancel edit and select the original location.");
      }

      await collection.doc(editingId).update(data);
    }
    else{
      await collection.add(data);
    }

    showNotice(editingId?"Question updated successfully.":"Question added successfully.","success");
    resetForm(false);
    await loadQuestions();

  }catch(error){
    console.error(error);
    showNotice(error.message || "Could not save question.","error");
  }finally{
    saving=false;
    $("saveBtn").disabled=false;
    $("saveBtn").textContent=editingId?"Update Question":"Save Question";
  }
});

/* =========================================
   RESET / EDIT
========================================= */

function resetForm(clearEdit=true){
  $("questionForm").reset();

  $("difficulty").value="Medium";
  $("marks").value="4";
  $("negativeMarks").value="1";
  $("published").checked=true;

  $("dynamicFields").replaceChildren();
  $("pyqYearWrap").classList.add("hidden");

  if(clearEdit){
    editingId=null;
    editingPath=null;
    editingQuestionData=null;
    $("formHeading").textContent="Add New Question";
    $("saveBtn").textContent="Save Question";

    $("subjectSelect").disabled=false;
    $("chapterSelect").disabled=false;
    $("typeSelect").disabled=false;
  }

  if($("typeSelect").value){
    renderDynamicForm();
  }
}

$("resetBtn").addEventListener("click",()=>{
  resetForm(true);
  showNotice("Form reset.","info");
});

$("cancelBtn").addEventListener("click",()=>{
  resetForm(true);
  showNotice("Edit cancelled.","info");
});

function editQuestion(question){
  const data=question.data;

  editingId=question.id;
  editingPath=question.path;
  editingQuestionData=data;

  $("subjectSelect").value=question.path.subjectId;
  $("chapterSelect").value=question.path.chapterId;
  $("typeSelect").value=question.path.typeId;

  $("subjectSelect").disabled=true;
  $("chapterSelect").disabled=true;
  $("typeSelect").disabled=true;

  $("formHeading").textContent="Edit Question";
  $("saveBtn").textContent="Update Question";

  $("questionOrder").value=data.order || 1;
  $("difficulty").value=data.difficulty || "Medium";
  $("marks").value=data.marks ?? 4;
  $("negativeMarks").value=data.negativeMarks ?? 1;
  $("ncertReference").value=data.ncertReference || "";
  $("solution").value=data.solution || "";
  $("solutionImageUrl").value=data.solutionImageUrl || "";
  $("published").checked=data.published!==false;

  $("pyqYear").value=data.pyqYear || data.year || "";

  updatePreview($("solutionImageUrl"),$("solutionPreview"));
  renderDynamicForm();
  populateDynamicForm(data);

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================================
   QUESTION LIST + PAGINATION
========================================= */

function filteredQuestions(){
  const search=$("searchInput").value.trim().toLowerCase();
  const status=$("statusFilter").value;

  return allQuestions.filter(q=>{
    const d=q.data;

    const text=[
      d.text,d.questionText,d.assertion,d.reason,
      d.columnOne,d.columnTwo,d.correctAnswer
    ].join(" ").toLowerCase();

    if(search && !text.includes(search)) return false;
    if(status==="published" && d.published===false) return false;
    if(status==="unpublished" && d.published!==false) return false;

    return true;
  });
}

function addText(parent,tag,value,className){
  const element=document.createElement(tag);
  element.textContent=safeText(value);
  if(className) element.className=className;
  parent.appendChild(element);
  return element;
}

function createQuestionCard(question){
  const d=question.data;
  const card=document.createElement("article");
  card.className="question-card";

  const meta=document.createElement("div");
  meta.className="question-meta";
  card.appendChild(meta);

  addText(meta,"span","Q. "+safeText(d.order),"tag");
  addText(meta,"span",d.questionType || d.typeName || selectedTypeName(),"tag");
  addText(meta,"span",d.difficulty || "Medium","tag");
  addText(meta,"span",d.published===false?"Unpublished":"Published","tag");

  addText(card,"p",d.text || d.questionText || "(No question text)");

  if(d.imageUrl){
    const img=document.createElement("img");
    img.className="preview";
    img.src=d.imageUrl;
    img.alt="Question diagram";
    img.onerror=()=>img.classList.add("hidden");
    card.appendChild(img);
  }

  if(d.options && Object.keys(d.options).length){
    ["A","B","C","D"].forEach(letter=>{
      if(d.options[letter]){
        addText(card,"p",letter+". "+d.options[letter]);
      }
    });
  }

  addText(card,"p","Correct Answer: "+safeText(d.correctAnswer));

  if(d.solution){
    addText(card,"p","Solution: "+d.solution);
  }

  const actions=document.createElement("div");
  actions.className="actions";
  card.appendChild(actions);

  const edit=document.createElement("button");
  edit.className="btn-blue btn-small";
  edit.textContent="Edit";
  edit.addEventListener("click",()=>editQuestion(question));
  actions.appendChild(edit);

  const toggle=document.createElement("button");
  toggle.className="btn-dark btn-small";
  toggle.textContent=d.published===false?"Publish":"Unpublish";
  toggle.addEventListener("click",()=>togglePublish(question));
  actions.appendChild(toggle);

  const del=document.createElement("button");
  del.className="btn-red btn-small";
  del.textContent="Delete";
  del.addEventListener("click",()=>deleteQuestion(question));
  actions.appendChild(del);

  return card;
}

function renderQuestions(){
  const list=$("questionList");
  list.replaceChildren();

  const filtered=filteredQuestions();
  const total=filtered.length;
  const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));

  page=Math.min(Math.max(1,page),totalPages);

  const start=(page-1)*PAGE_SIZE;
  const current=filtered.slice(start,start+PAGE_SIZE);

  $("countLabel").textContent=
    "Total: "+total+" | Showing "+(total?start+1:0)+"-"+Math.min(start+PAGE_SIZE,total)+
    " | Maximum 180 questions per page";

  $("pageLabel").textContent="Page "+page+" of "+totalPages;
  $("prevBtn").disabled=page<=1;
  $("nextBtn").disabled=page>=totalPages;

  if(!current.length){
    addText(list,"p","No questions found.","muted");
    return;
  }

  current.forEach(question=>{
    list.appendChild(createQuestionCard(question));
  });
}

$("prevBtn").addEventListener("click",()=>{
  if(page>1){
    page--;
    renderQuestions();
    $("questionList").scrollIntoView({behavior:"smooth"});
  }
});

$("nextBtn").addEventListener("click",()=>{
  const totalPages=Math.max(1,Math.ceil(filteredQuestions().length/PAGE_SIZE));
  if(page<totalPages){
    page++;
    renderQuestions();
    $("questionList").scrollIntoView({behavior:"smooth"});
  }
});

$("searchInput").addEventListener("input",()=>{
  page=1;
  renderQuestions();
});

$("statusFilter").addEventListener("change",()=>{
  page=1;
  renderQuestions();
});

/* =========================================
   PUBLISH / UNPUBLISH
========================================= */

async function togglePublish(question){
  try{
    const collection=questionCollection();
    if(!collection) return;

    const next=question.data.published===false;
    await collection.doc(question.id).update({
      published:next,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    showNotice(next?"Question published.":"Question unpublished.","success");
    await loadQuestions();

  }catch(error){
    showNotice("Could not update publication status: "+error.message,"error");
  }
}

/* =========================================
   DELETE QUESTION
========================================= */

async function deleteQuestion(question){
  if(!confirm("Are you sure you want to permanently delete this question?")){
    return;
  }

  try{
    const collection=questionCollection();
    if(!collection) return;

    await collection.doc(question.id).delete();

    showNotice("Question deleted successfully.","success");
    await loadQuestions();

  }catch(error){
    showNotice("Delete failed: "+error.message,"error");
  }
}

/* =========================================
   LOGOUT
========================================= */

window.logoutAdmin=async function(){
  await auth.signOut();
  location.href="index.html";
};
