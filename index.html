<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f50">

  <title>mNEET | Student Login</title>

  <link rel="stylesheet" href="css/auth.css">

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
</head>

<body>
  <main class="auth-container">

    <header class="brand">
      <div class="brand-logo">m<span>NEET</span></div>
      <p>Your NEET Preparation Partner</p>
    </header>

    <section class="auth-card">

      <div class="auth-tabs">
        <button id="loginTab" class="tab active" type="button">
          Login
        </button>

        <button id="registerTab" class="tab" type="button">
          Register
        </button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <h2>Welcome Back!</h2>
        <p class="subtitle">Continue your NEET preparation.</p>

        <label for="loginEmail">Email Address</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="loginPassword">Password</label>

        <div class="password-box">
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            class="show-password"
            type="button"
            data-target="loginPassword"
            aria-label="Show password"
          >Show</button>
        </div>

        <button id="loginButton" class="primary-btn" type="submit">
          Login
        </button>

        <button id="forgotPassword" class="text-btn" type="button">
          Forgot Password?
        </button>

        <p class="switch-text">
          Don't have an account?
          <button id="openRegister" class="inline-btn" type="button">
            Register
          </button>
        </p>

      </form>

      <!-- REGISTRATION FORM -->
      <form id="registerForm" hidden>

        <h2>Create Account</h2>
        <p class="subtitle">Start your NEET preparation with mNEET.</p>

        <label for="fullName">Full Name</label>
        <input
          id="fullName"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          maxlength="80"
          required
        >

        <label for="phone">Phone Number</label>
        <input
          id="phone"
          type="tel"
          placeholder="10-digit mobile number"
          inputmode="numeric"
          pattern="[0-9]{10}"
          maxlength="10"
          autocomplete="tel-national"
          required
        >

        <label for="city">City</label>
        <input
          id="city"
          type="text"
          placeholder="Enter your city"
          maxlength="80"
          autocomplete="address-level2"
          required
        >

        <label for="registerEmail">Email Address</label>
        <input
          id="registerEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="registerPassword">Create Password</label>

        <div class="password-box">
          <input
            id="registerPassword"
            type="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            autocomplete="new-password"
            required
          >

          <button
            class="show-password"
            type="button"
            data-target="registerPassword"
            aria-label="Show password"
          >Show</button>
        </div>

        <button id="registerButton" class="primary-btn" type="submit">
          Create Account
        </button>

        <p class="switch-text">
          Already have an account?
          <button id="openLogin" class="inline-btn" type="button">
            Login
          </button>
        </p>

      </form>

    </section>

    <footer>
      <p>Made for NEET aspirants</p>
      <button id="themeToggle" class="theme-btn" type="button">
        🌙 Dark Mode
      </button>
    </footer>

  </main>

  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
