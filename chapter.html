<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f50">

  <title>mNEET | Chapters</title>

  <style>
    :root {
      --bg: #f3f8f5;
      --card: #ffffff;
      --text: #173329;
      --muted: #718078;
      --green: #087f50;
      --border: #dce8e0;
      --soft: #eaf7ef;
    }

    body.dark {
      --bg: #0d1713;
      --card: #17231d;
      --text: #edf7f0;
      --muted: #a4b6aa;
      --green: #22a66b;
      --border: #304238;
      --soft: #203b2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 800px;
      min-height: 62px;
      padding: 12px 16px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      flex: 1;
      font-size: 23px;
      font-weight: 900;
    }

    .brand span {
      color: #d7a51b;
    }

    .small-btn {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: var(--text);
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .page {
      max-width: 800px;
      margin: auto;
      padding: 20px 15px 35px;
    }

    .back-btn {
      border: none;
      background: transparent;
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .subject-banner {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--soft);
      border-radius: 13px;
      font-size: 25px;
    }

    .subject-name {
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .subject-caption {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .heading {
      margin: 25px 0 6px;
      font-size: 20px;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chapter-card {
      width: 100%;
      min-height: 73px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      text-align: left;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .chapter-card:hover {
      border-color: var(--green);
    }

    .chapter-number {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--green);
      border-radius: 11px;
      font-weight: 800;
      font-size: 14px;
    }

    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-title {
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .chapter-caption {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .arrow {
      color: var(--green);
      font-size: 23px;
    }

    /* Added: subject completion percentage on the right */

    .subject-progress {
      margin-left: auto;
      flex-shrink: 0;
      text-align: right;
      font-size: 12px;
      font-weight: 800;
      color: var(--green);
      white-space: nowrap;
    }

    /* Added: chapter completion percentage on the right */

    .chapter-progress {
      flex-shrink: 0;
      text-align: right;
      font-size: 12px;
      font-weight: 800;
      color: var(--green);
      white-space: nowrap;
    }

    .status {
      padding: 22px 15px;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 13px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .status strong {
      display: block;
      color: var(--text);
      margin-bottom: 5px;
      font-size: 15px;
    }

    .retry-btn {
      margin-top: 12px;
      padding: 9px 15px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 9px;
      font-weight: 700;
    }

    .footer {
      padding: 25px 10px 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 400px) {
      .page {
        padding: 17px 12px 30px;
      }

      .topbar-inner {
        padding: 10px 12px;
      }

      .brand {
        font-size: 21px;
      }

      .small-btn {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <button id="backButton" class="small-btn" type="button">
        ← Back
      </button>

      <div class="brand">m<span>NEET</span></div>

      <button id="themeToggle" class="small-btn" type="button">
        🌙 Dark
      </button>
    </div>
  </header>

  <main class="page">

    <section class="subject-banner">
      <div id="subjectIcon" class="subject-icon">📘</div>

      <div>
        <div id="subjectName" class="subject-name">
          Loading subject...
        </div>

        <div class="subject-caption">
          Select a chapter to continue practising
        </div>
      </div>

      <!-- Added: Subject completion percentage -->
      <div class="subject-progress">
        <span id="subjectPercentage">0%</span>
        <div>Complete</div>
      </div>
    </section>

    <h1 class="heading">Chapters</h1>

    <p class="description">
      Choose a chapter to view the quiz types published by your administrator.
    </p>

    <section
      id="chapterList"
      class="chapter-list"
      aria-live="polite"
    >
      <div class="status">
        <strong>Loading chapters...</strong>
        Please wait.
      </div>
    </section>

    <footer class="footer">
      mNEET · Simple · Focused · For Your Dream
    </footer>

  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>

  <script>
    "use strict";

    const chapterList = document.getElementById("chapterList");
    const subjectNameElement = document.getElementById("subjectName");
    const subjectIconElement = document.getElementById("subjectIcon");
    const subjectPercentageElement =
      document.getElementById("subjectPercentage");
    const themeToggle = document.getElementById("themeToggle");

    const subjectId = localStorage.getItem("activeSubject");

    let currentUser = null;
    let profileVerified = false;
    let loading = false;

    /* Theme */

    function applyTheme(theme) {
      const dark = theme === "dark";

      document.body.classList.toggle("dark", dark);

      themeToggle.textContent = dark
        ? "☀️ White"
        : "🌙 Dark";
    }

    applyTheme(
      localStorage.getItem("mneetTheme") === "dark"
        ? "dark"
        : "white"
    );

    themeToggle.addEventListener("click", function () {
      const nextTheme = document.body.classList.contains("dark")
        ? "white"
        : "dark";

      localStorage.setItem("mneetTheme", nextTheme);
      applyTheme(nextTheme);
    });

    /* Back button */

    document.getElementById("backButton").addEventListener(
      "click",
      function () {
        window.location.href = "student.html";
      }
    );

    /* Subject icon */

    function getSubjectIcon(name) {
      const value = name.toLowerCase();

      if (value.includes("biology")) return "🧬";
      if (value.includes("physics")) return "⚛️";
      if (value.includes("chemistry")) return "🧪";

      return "📘";
    }

    /*
      Completion percentage storage format:

      Chapter:
      localStorage key:
      mneetChapterProgress_SUBJECT_ID_CHAPTER_ID

      Value:
      0 to 100

      Subject:
      The average completion percentage of its published chapters.

      If no chapter progress has been saved yet, the percentage is 0%.
    */

    function getChapterProgress(chapterId) {
      const key =
        "mneetChapterProgress_" + subjectId + "_" + chapterId;

      const storedValue = localStorage.getItem(key);

      if (storedValue === null) {
        return 0;
      }

      const percentage = Number(storedValue);

      if (!Number.isFinite(percentage)) {
        return 0;
      }

      return Math.max(0, Math.min(100, Math.round(percentage)));
    }

    function updateSubjectProgress(chapters) {
      if (!chapters.length) {
        subjectPercentageElement.textContent = "0%";
        return;
      }

      const totalPercentage = chapters.reduce(
        function (total, chapter) {
          return total + getChapterProgress(chapter.id);
        },
        0
      );

      const subjectPercentage = Math.round(
        totalPercentage / chapters.length
      );

      subjectPercentageElement.textContent =
        subjectPercentage + "%";
    }

    /* Status message */

    function showStatus(title, detail, retry = false) {
      chapterList.replaceChildren();

      const box = document.createElement("div");
      box.className = "status";

      const heading = document.createElement("strong");
      heading.textContent = title;

      const message = document.createElement("div");
      message.textContent = detail;

      box.append(heading, message);

      if (retry) {
        const button = document.createElement("button");
        button.className = "retry-btn";
        button.textContent = "Try Again";
        button.addEventListener("click", loadChapters);
        box.appendChild(button);
      }

      chapterList.appendChild(box);
    }

    /* Load published chapters */

    async function loadChapters() {
      if (loading) return;

      if (!currentUser || !profileVerified) {
        showStatus(
          "Verifying account",
          "Please wait while we check your student access."
        );
        return;
      }

      if (!subjectId) {
        showStatus(
          "No subject selected",
          "Return to the dashboard and select a subject."
        );
        return;
      }

      loading = true;

      showStatus("Loading chapters", "Fetching published chapters...");

      try {
        // Verify that the selected subject exists and is published.
        const subjectDoc = await db
          .collection("subjects")
          .doc(subjectId)
          .get();

        if (
          !subjectDoc.exists ||
          subjectDoc.data().published !== true
        ) {
          showStatus(
            "Subject unavailable",
            "This subject is not currently published."
          );
          return;
        }

        const subjectData = subjectDoc.data();
        const subjectName = String(subjectData.name || "Subject");

        subjectNameElement.textContent = subjectName;
        subjectIconElement.textContent = getSubjectIcon(subjectName);

        // Only chapters published by Admin are shown.
        const snapshot = await db
          .collection("subjects")
          .doc(subjectId)
          .collection("chapters")
          .where("published", "==", true)
          .get();

        const chapters = [];

        snapshot.forEach(function (doc) {
          const data = doc.data();

          if (typeof data.name !== "string" || !data.name.trim()) {
            return;
          }

          chapters.push({
            id: doc.id,
            name: data.name.trim(),
            order: Number(data.order) || 0
          });
        });

        chapters.sort(function (a, b) {
          if (a.order !== b.order) {
            return a.order - b.order;
          }

          return a.name.localeCompare(b.name);
        });

        // Update the subject completion percentage.
        updateSubjectProgress(chapters);

        chapterList.replaceChildren();

        if (chapters.length === 0) {
          showStatus(
            "No chapters published",
            "Chapters will appear here after the administrator publishes them."
          );
          return;
        }

        chapters.forEach(function (chapter, index) {
          const card = document.createElement("button");

          card.type = "button";
          card.className = "chapter-card";

          const number = document.createElement("span");
          number.className = "chapter-number";
          number.textContent = String(index + 1);

          const info = document.createElement("span");
          info.className = "chapter-info";

          const title = document.createElement("span");
          title.className = "chapter-title";
          title.textContent = chapter.name;

          const caption = document.createElement("span");
          caption.className = "chapter-caption";
          caption.textContent = "View available quiz types";

          info.append(title, document.createElement("br"), caption);

          // Added: Chapter completion percentage on the right.
          const progress = document.createElement("span");
          progress.className = "chapter-progress";
          progress.textContent = getChapterProgress(chapter.id) + "%";

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "›";

          card.append(number, info, progress, arrow);

          card.addEventListener("click", function () {
            localStorage.setItem("activeChapter", chapter.id);
            localStorage.removeItem("activeQuizType");

            window.location.href = "quiz-types.html";
          });

          chapterList.appendChild(card);
        });

      } catch (error) {
        console.error("Chapter loading failed:", error);

        showStatus(
          "Unable to load chapters",
          error.code === "permission-denied"
            ? "Firestore Rules denied access. Check the rules for published subjects and chapters."
            : "Check your internet connection and Firebase configuration.",
          true
        );

      } finally {
        loading = false;
      }
    }

    /* Verify student */

    if (
      window.mneetFirebaseReady !== true ||
      !window.auth ||
      !window.db
    ) {
      showStatus(
        "Firebase not configured",
        "Check js/firebase.js and your Firebase Console settings."
      );

    } else if (!subjectId) {
      showStatus(
        "No subject selected",
        "Return to the dashboard and choose a subject."
      );

    } else {
      auth.onAuthStateChanged(async function (user) {
        if (!user) {
          window.location.replace("index.html");
          return;
        }

        currentUser = user;

        try {
          const profile = await db
            .collection("users")
            .doc(user.uid)
            .get();

          if (!profile.exists) {
            await auth.signOut();
            window.location.replace("index.html");
            return;
          }

          const data = profile.data();

          if (
            data.role !== "student" ||
            data.status !== "active"
          ) {
            await auth.signOut();
            window.location.replace("index.html");
            return;
          }

          profileVerified = true;

          await loadChapters();

        } catch (error) {
          console.error("Student verification failed:", error);

          showStatus(
            "Account verification failed",
            "Check your Firestore Rules and internet connection.",
            true
          );
        }
      });
    }
  </script>

</body>
</html>
