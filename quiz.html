<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz | mNEET</title>

<style>
:root {
  --bg: #f4f7f5;
  --card: #ffffff;
  --text: #17251d;
  --muted: #68776d;
  --green: #168348;
  --green-light: #e4f5eb;
  --border: #dce6df;
  --red: #d83232;
  --yellow: #fff3cf;
  --shadow: 0 4px 18px rgba(20, 70, 40, 0.07);
}

body.dark {
  --bg: #101713;
  --card: #1b2620;
  --text: #edf5ef;
  --muted: #a5b6aa;
  --green: #48c783;
  --green-light: #203d2d;
  --border: #34453a;
  --red: #ff6868;
  --yellow: #493d20;
  --shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  transition: background .2s, color .2s;
}

button {
  font: inherit;
  cursor: pointer;
}

.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.toprow {
  max-width: 760px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 23px;
  font-weight: 800;
  color: var(--green);
}

.brand small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  margin-top: 3px;
}

.iconbtn {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
}

.container {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 18px 14px 35px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.quiz-name {
  font-size: 15px;
  font-weight: 700;
}

.question-count {
  font-size: 13px;
  color: var(--muted);
  margin-top: 5px;
}

.timer-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px 15px;
  box-shadow: var(--shadow);
  margin-bottom: 15px;
}

.timer-label {
  font-size: 12px;
  color: var(--muted);
}

.timer {
  color: var(--green);
  font-size: 22px;
  font-weight: 800;
  margin-top: 4px;
}

.timer.warning {
  color: var(--red);
}

.progress-track {
  height: 6px;
  background: var(--border);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 18px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--green);
  transition: width .2s;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 18px 16px;
  box-shadow: var(--shadow);
}

.q-label {
  color: var(--green);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
}

.question {
  font-size: 18px;
  line-height: 1.6;
  font-weight: 600;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.question-image {
  display: none;
  width: 100%;
  max-height: 330px;
  object-fit: contain;
  margin: 15px 0;
  border-radius: 10px;
  background: var(--bg);
}

.options {
  display: grid;
  gap: 11px;
  margin-top: 22px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  text-align: left;
  padding: 13px 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 12px;
  line-height: 1.5;
}

.option-letter {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 29px;
  height: 29px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
}

.option-text {
  padding-top: 4px;
  overflow-wrap: anywhere;
}

.option.selected {
  border: 2px solid var(--green);
  background: var(--green-light);
}

.option.correct {
  border: 2px solid #168348;
  background: #d9f7e4;
  color: #124d2c;
}

.option.wrong {
  border: 2px solid var(--red);
  background: #ffe1e1;
  color: #861c1c;
}

body.dark .option.correct {
  background: #244c34;
  color: #e3ffeb;
}

body.dark .option.wrong {
  background: #512727;
  color: #ffe9e9;
}

.option:disabled {
  cursor: default;
  opacity: 1;
}

.feedback {
  display: none;
  padding: 13px;
  border-radius: 12px;
  margin-top: 16px;
  line-height: 1.6;
  font-size: 14px;
}

.feedback.show {
  display: block;
}

.feedback.good {
  background: var(--green-light);
  border: 1px solid var(--green);
}

.feedback.bad {
  background: var(--yellow);
  border: 1px solid #d4a52c;
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.btn {
  border: 0;
  border-radius: 11px;
  padding: 12px 14px;
  font-weight: 700;
  min-height: 45px;
}

.btn-primary {
  background: var(--green);
  color: white;
}

.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.action-row .btn {
  flex: 1;
}

.navigation {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.navigation .btn {
  flex: 1;
}

.submit-area {
  margin-top: 20px;
  padding-top: 17px;
  border-top: 1px solid var(--border);
}

.submit-area .btn {
  width: 100%;
}

.note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
  margin-top: 12px;
}

.message {
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  line-height: 1.7;
}

.hidden {
  display: none !important;
}

@media (min-width: 600px) {
  .container {
    padding-top: 25px;
  }

  .card {
    padding: 25px;
  }

  .question {
    font-size: 20px;
  }

  .options {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="toprow">
    <div class="brand">
      mNEET
      <small>Practice • Improve • Succeed</small>
    </div>

    <button class="iconbtn" id="themeBtn" type="button">
      🌙 Dark
    </button>
  </div>
</header>

<main class="container">

  <div id="loading" class="message">
    Quiz লোড হচ্ছে...
  </div>

  <div id="errorBox" class="message hidden"></div>

  <section id="quizArea" class="hidden">

    <div class="info-row">
      <div>
        <div class="quiz-name" id="quizTitle">Practice Quiz</div>
        <div class="question-count" id="questionCount">
          Question 1
        </div>
      </div>

      <button class="iconbtn" id="exitBtn" type="button">
        Exit
      </button>
    </div>

    <div class="timer-card">
      <div>
        <div class="timer-label">TIME LEFT FOR THIS QUESTION</div>
        <div class="timer" id="questionTimer">01:00</div>
      </div>

      <div>
        <div class="timer-label">TOTAL TIME</div>
        <div class="timer" id="totalTimer">00:00</div>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="card">

      <div class="q-label" id="questionLabel">QUESTION 1</div>

      <div class="question" id="questionText">
        Question will appear here.
      </div>

      <img
        id="questionImage"
        class="question-image"
        alt="Question diagram"
      >

      <div class="options" id="options"></div>

      <div id="feedback" class="feedback"></div>

      <div class="action-row">
        <button
          class="btn btn-primary"
          id="answerBtn"
          type="button"
        >
          Submit Answer
        </button>

        <button
          class="btn btn-secondary"
          id="clearBtn"
          type="button"
        >
          Clear
        </button>
      </div>

      <div class="navigation">
        <button
          class="btn btn-secondary"
          id="prevBtn"
          type="button"
        >
          ← Previous
        </button>

        <button
          class="btn btn-primary"
          id="nextBtn"
          type="button"
        >
          Next →
        </button>
      </div>

      <div class="submit-area">
        <button
          class="btn btn-primary"
          id="submitQuizBtn"
          type="button"
        >
          Submit Quiz
        </button>

        <div class="note">
          Submit Answer দিয়ে উত্তর যাচাই করো।
          সব প্রশ্ন শেষ হলে Submit Quiz চাপো।
        </div>
      </div>

    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  const KEYS = {
    subject: "activeSubject",
    chapter: "activeChapter",
    quizType: "activeQuizType",
    answers: "mneetQuizAnswers",
    result: "mneetQuizResult"
  };

  const QUESTION_SECONDS = 60;

  let questions = [];
  let answers = {};
  let currentIndex = 0;
  let questionSeconds = QUESTION_SECONDS;
  let totalSeconds = 0;
  let questionInterval = null;
  let totalInterval = null;
  let answeredThisVisit = false;
  let quizSubmitted = false;
  let startedAt = Date.now();
  let quizTitle = "Practice Quiz";
  let sessionKey = "";

  function getTheme() {
    return localStorage.getItem("mneetTheme") || "light";
  }

  function applyTheme() {
    const dark = getTheme() === "dark";
    document.body.classList.toggle("dark", dark);
    $("themeBtn").textContent = dark ? "☀️ Light" : "🌙 Dark";
  }

  $("themeBtn").addEventListener("click", function () {
    localStorage.setItem(
      "mneetTheme",
      getTheme() === "dark" ? "light" : "dark"
    );
    applyTheme();
  });

  applyTheme();

  function showError(message) {
    $("loading").classList.add("hidden");
    $("quizArea").classList.add("hidden");
    $("errorBox").classList.remove("hidden");
    $("errorBox").textContent = message;
  }

  function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;

    return String(minutes).padStart(2, "0") + ":" +
      String(remaining).padStart(2, "0");
  }

  function stopQuestionTimer() {
    if (questionInterval) {
      clearInterval(questionInterval);
      questionInterval = null;
    }
  }

  function stopAllTimers() {
    stopQuestionTimer();

    if (totalInterval) {
      clearInterval(totalInterval);
      totalInterval = null;
    }
  }

  function saveProgress() {
    if (!sessionKey) return;

    try {
      localStorage.setItem(sessionKey, JSON.stringify({
        answers,
        currentIndex,
        totalSeconds,
        questionSeconds,
        startedAt,
        quizSubmitted
      }));
    } catch (error) {
      console.warn("Could not save quiz progress.", error);
    }
  }

  function loadProgress() {
    if (!sessionKey) return;

    try {
      const raw = localStorage.getItem(sessionKey);
      if (!raw) return;

      const saved = JSON.parse(raw);

      answers = saved.answers || {};
      currentIndex = Number(saved.currentIndex) || 0;
      totalSeconds = Number(saved.totalSeconds) || 0;
      questionSeconds = Number.isFinite(saved.questionSeconds)
        ? saved.questionSeconds
        : QUESTION_SECONDS;

      startedAt = Number(saved.startedAt) || Date.now();
      quizSubmitted = saved.quizSubmitted === true;

      if (currentIndex < 0 || currentIndex >= questions.length) {
        currentIndex = 0;
      }
    } catch (error) {
      console.warn("Could not restore quiz progress.", error);
    }
  }

  function normalizeQuestion(doc) {
    const data = doc.data() || {};
    const rawOptions = data.options || {};

    const options = ["A", "B", "C", "D"].map(letter => ({
      letter,
      text: rawOptions[letter] == null
        ? ""
        : String(rawOptions[letter])
    }));

    const correct = String(
      data.correctOption || data.correctAnswer || ""
    ).trim().toUpperCase();

    return {
      id: doc.id,
      question: String(data.question || data.text || ""),
      imageUrl: String(data.imageUrl || ""),
      options,
      correctOption: correct,
      solution: String(data.solution || ""),
      published: data.published === true,
      order: Number(data.order) || 0
    };
  }

  async function initQuiz() {
    try {
      if (!window.mneetFirebaseReady || !window.auth || !window.db) {
        throw new Error(
          "Firebase প্রস্তুত হয়নি। js/firebase.js-এর configuration পরীক্ষা করো।"
        );
      }

      const user = window.auth.currentUser;

      if (!user) {
        window.location.replace("index.html");
        return;
      }

      const subjectId = localStorage.getItem(KEYS.subject);
      const chapterId = localStorage.getItem(KEYS.chapter);
      const quizTypeId = localStorage.getItem(KEYS.quizType);

      if (!subjectId || !chapterId || !quizTypeId) {
        throw new Error(
          "Quiz নির্বাচন পাওয়া যায়নি। Dashboard থেকে আবার Subject, Chapter ও Quiz নির্বাচন করো।"
        );
      }

      const profileDoc = await window.db
        .collection("users")
        .doc(user.uid)
        .get();

      if (
        !profileDoc.exists ||
        profileDoc.data().role !== "student" ||
        profileDoc.data().status !== "active"
      ) {
        await window.auth.signOut();
        window.location.replace("index.html");
        return;
      }

      const subjectRef = window.db
        .collection("subjects")
        .doc(subjectId);

      const chapterRef = subjectRef
        .collection("chapters")
        .doc(chapterId);

      const quizRef = chapterRef
        .collection("quizTypes")
        .doc(quizTypeId);

      const [subjectDoc, chapterDoc, quizDoc] = await Promise.all([
        subjectRef.get(),
        chapterRef.get(),
        quizRef.get()
      ]);

      if (
        !subjectDoc.exists ||
        subjectDoc.data().published !== true ||
        !chapterDoc.exists ||
        chapterDoc.data().published !== true ||
        !quizDoc.exists ||
        quizDoc.data().published !== true
      ) {
        throw new Error(
          "এই Quiz বর্তমানে প্রকাশিত নেই অথবা পাওয়া যায়নি।"
        );
      }

      quizTitle = quizDoc.data().name ||
        quizDoc.data().title ||
        "Practice Quiz";

      $("quizTitle").textContent = quizTitle;

      const questionSnapshot = await quizRef
        .collection("questions")
        .where("published", "==", true)
        .get();

      questions = questionSnapshot.docs
        .map(normalizeQuestion)
        .filter(q => q.question || q.imageUrl)
        .sort((a, b) => a.order - b.order);

      if (questions.length === 0) {
        throw new Error(
          "এই Quiz-এ এখনও কোনো প্রকাশিত প্রশ্ন নেই। Admin-কে প্রশ্ন প্রকাশ করতে বলো।"
        );
      }

      sessionKey = "mneetQuiz_" +
        user.uid + "_" +
        subjectId + "_" +
        chapterId + "_" +
        quizTypeId;

      loadProgress();

      $("loading").classList.add("hidden");
      $("errorBox").classList.add("hidden");
      $("quizArea").classList.remove("hidden");

      if (quizSubmitted) {
        showError(
          "এই Quiz ইতিমধ্যে Submit করা হয়েছে। আবার দিতে চাইলে Reattempt ব্যবস্থা পরের ধাপে যুক্ত হবে।"
        );
        return;
      }

      renderQuestion();
      startTotalTimer();
      startQuestionTimer();

    } catch (error) {
      console.error("Quiz loading error:", error);
      showError(error.message || "Quiz লোড করা যায়নি।");
    }
  }

  function renderQuestion() {
    const q = questions[currentIndex];

    if (!q) return;

    answeredThisVisit = answers[q.id]?.submitted === true;

    $("questionCount").textContent =
      "Question " + (currentIndex + 1) + " of " + questions.length;

    $("questionLabel").textContent =
      "QUESTION " + (currentIndex + 1);

    $("questionText").textContent = q.question || "";

    const image = $("questionImage");

    if (q.imageUrl) {
      image.src = q.imageUrl;
      image.style.display = "block";
      image.onerror = () => {
        image.style.display = "none";
      };
    } else {
      image.removeAttribute("src");
      image.style.display = "none";
    }

    $("progressBar").style.width =
      ((currentIndex + 1) / questions.length * 100) + "%";

    $("prevBtn").disabled = currentIndex === 0;

    $("nextBtn").textContent =
      currentIndex === questions.length - 1
        ? "Last Question"
        : "Next →";

    const savedAnswer = answers[q.id]?.selected || "";
    const optionBox = $("options");

    optionBox.replaceChildren();

    q.options.forEach(option => {
      if (!option.text) return;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";

      const letter = document.createElement("span");
      letter.className = "option-letter";
      letter.textContent = option.letter;

      const text = document.createElement("span");
      text.className = "option-text";
      text.textContent = option.text;

      button.append(letter, text);

      if (savedAnswer === option.letter) {
        button.classList.add("selected");
      }

      if (answeredThisVisit) {
        button.disabled = true;

        if (option.letter === q.correctOption) {
          button.classList.add("correct");
        } else if (option.letter === savedAnswer) {
          button.classList.add("wrong");
        }
      } else {
        button.addEventListener("click", () => {
          selectOption(q.id, option.letter);
        });
      }

      optionBox.appendChild(button);
    });

    $("answerBtn").disabled = answeredThisVisit;
    $("clearBtn").disabled = answeredThisVisit;

    showFeedback(q);

    questionSeconds = Number.isFinite(answers[q.id]?.secondsLeft)
      ? answers[q.id].secondsLeft
      : QUESTION_SECONDS;

    updateQuestionTimer();
    saveProgress();
  }

  function selectOption(questionId, letter) {
    if (answeredThisVisit || quizSubmitted) return;

    answers[questionId] = {
      ...(answers[questionId] || {}),
      selected: letter,
      submitted: false,
      secondsLeft: questionSeconds
    };

    $("options").querySelectorAll(".option").forEach(button => {
      button.classList.remove("selected");

      if (button.querySelector(".option-letter").textContent === letter) {
        button.classList.add("selected");
      }
    });

    saveProgress();
  }

  function showFeedback(q) {
    const box = $("feedback");
    const saved = answers[q.id];

    box.className = "feedback";
    box.textContent = "";

    if (!saved || !saved.submitted) return;

    box.classList.add("show");

    const isCorrect = saved.selected === q.correctOption;

    box.classList.add(isCorrect ? "good" : "bad");

    const heading = document.createElement("strong");
    heading.textContent = isCorrect
      ? "Correct Answer ✓"
      : "Incorrect Answer";

    box.appendChild(heading);

    if (!isCorrect) {
      const correctLine = document.createElement("div");
      correctLine.textContent = "Correct option: " +
        (q.correctOption || "Not provided");
      box.appendChild(correctLine);
    }

    if (q.solution) {
      const solution = document.createElement("p");
      solution.textContent = "Solution: " + q.solution;
      box.appendChild(solution);
    }
  }

  function submitAnswer() {
    const q = questions[currentIndex];

    if (!q || answeredThisVisit || quizSubmitted) return;

    const selected = answers[q.id]?.selected;

    if (!selected) {
      alert("আগে একটি উত্তর নির্বাচন করো।");
      return;
    }

    if (!["A", "B", "C", "D"].includes(q.correctOption)) {
      alert(
        "এই প্রশ্নের Correct Option Admin সেট করেননি। Admin-কে ঠিক করতে বলো।"
      );
      return;
    }

    answers[q.id] = {
      ...answers[q.id],
      selected,
      submitted: true,
      correct: selected === q.correctOption,
      secondsLeft: questionSeconds
    };

    answeredThisVisit = true;

    stopQuestionTimer();
    renderQuestion();
    saveProgress();
  }

  function clearAnswer() {
    const q = questions[currentIndex];

    if (!q || answeredThisVisit) return;

    delete answers[q.id];

    $("options").querySelectorAll(".option").forEach(button => {
      button.classList.remove("selected");
    });

    saveProgress();
  }

  function updateQuestionTimer() {
    $("questionTimer").textContent = formatTime(questionSeconds);
    $("questionTimer").classList.toggle(
      "warning",
      questionSeconds <= 10
    );
  }

  function startQuestionTimer() {
    stopQuestionTimer();

    if (answeredThisVisit || quizSubmitted) return;

    updateQuestionTimer();

    questionInterval = setInterval(() => {
      questionSeconds--;

      const q = questions[currentIndex];

      if (q && answers[q.id]) {
        answers[q.id].secondsLeft = questionSeconds;
      }

      updateQuestionTimer();
      saveProgress();

      if (questionSeconds <= 0) {
        stopQuestionTimer();

        if (q && !answers[q.id]?.submitted) {
          answers[q.id] = {
            ...(answers[q.id] || {}),
            submitted: false,
            timedOut: true,
            secondsLeft: 0
          };
        }

        saveProgress();

        alert("এই প্রশ্নের সময় শেষ। Next চাপ দিয়ে এগিয়ে যাও।");
      }
    }, 1000);
  }

  function startTotalTimer() {
    $("totalTimer").textContent = formatTime(totalSeconds);

    totalInterval = setInterval(() => {
      if (quizSubmitted) return;

      totalSeconds++;
      $("totalTimer").textContent = formatTime(totalSeconds);
      saveProgress();
    }, 1000);
  }

  function goToQuestion(index) {
    if (index < 0 || index >= questions.length) return;

    stopQuestionTimer();

    const oldQ = questions[currentIndex];

    if (oldQ && !answers[oldQ.id]?.submitted) {
      answers[oldQ.id] = {
        ...(answers[oldQ.id] || {}),
        secondsLeft: questionSeconds
      };
    }

    currentIndex = index;
    renderQuestion();
    startQuestionTimer();
    saveProgress();
  }

  function submitQuiz() {
    if (quizSubmitted) return;

    const unanswered = questions.filter(q =>
      !answers[q.id]?.submitted
    ).length;

    const message = unanswered > 0
      ? unanswered + "টি প্রশ্ন Submit করা হয়নি। তবুও Quiz Submit করবে?"
      : "Quiz Submit করবে?";

    if (!confirm(message)) return;

    quizSubmitted = true;
    stopAllTimers();

    const result = {
      title: quizTitle,
      totalQuestions: questions.length,
      attempted: 0,
      correct: 0,
      incorrect: 0,
      skipped: 0,
      totalSeconds,
      submittedAt: new Date().toISOString(),
      questions: []
    };

    questions.forEach(q => {
      const answer = answers[q.id] || {};
      const submitted = answer.submitted === true;
      const correct = submitted && answer.selected === q.correctOption;

      if (submitted) {
        result.attempted++;
        if (correct) result.correct++;
        else result.incorrect++;
      } else {
        result.skipped++;
      }

      result.questions.push({
        id: q.id,
        question: q.question,
        imageUrl: q.imageUrl,
        options: q.options,
        correctOption: q.correctOption,
        solution: q.solution,
        selected: answer.selected || "",
        submitted,
        correct
      });
    });

    result.score = result.correct;
    result.accuracy = result.attempted
      ? Math.round(result.correct / result.attempted * 100)
      : 0;

    try {
      localStorage.setItem(KEYS.result, JSON.stringify(result));
      saveProgress();
    } catch (error) {
      alert("Result সংরক্ষণ করা যায়নি। ফোনের storage পরীক্ষা করো।");
      return;
    }

    window.location.href = "result.html";
  }

  $("answerBtn").addEventListener("click", submitAnswer);
  $("clearBtn").addEventListener("click", clearAnswer);

  $("prevBtn").addEventListener("click", () => {
    goToQuestion(currentIndex - 1);
  });

  $("nextBtn").addEventListener("click", () => {
    if (currentIndex < questions.length - 1) {
      goToQuestion(currentIndex + 1);
    } else {
      alert("এটাই শেষ প্রশ্ন। Quiz শেষ করতে Submit Quiz চাপো।");
    }
  });

  $("submitQuizBtn").addEventListener("click", submitQuiz);

  $("exitBtn").addEventListener("click", () => {
    if (confirm("Quiz থেকে বের হতে চাও? Progress সংরক্ষিত থাকবে।")) {
      stopAllTimers();
      window.location.href = "quiz-types.html";
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      saveProgress();
    }
  });

  window.addEventListener("beforeunload", saveProgress);

  if (window.auth) {
    window.auth.onAuthStateChanged(user => {
      if (user) initQuiz();
    });
  } else {
    showError(
      "Firebase পাওয়া যায়নি। js/firebase.js এবং Firebase configuration পরীক্ষা করো।"
    );
  }
})();
</script>

</body>
</html>
