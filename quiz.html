<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8f7ee">

<title>Quiz | mNEET</title>

<style>
:root {
  --bg: #f5faf6;
  --card: #ffffff;
  --text: #26372d;
  --muted: #748278;
  --green: #71c995;
  --green-dark: #328b59;
  --green-light: #e8f7ee;
  --border: #dcebe0;
  --red: #d95d65;
  --red-light: #fff0f0;
  --yellow: #fff8df;
  --shadow: 0 3px 14px rgba(45, 100, 65, .06);
}

body.dark {
  --bg: #111914;
  --card: #1d2921;
  --text: #edf5ef;
  --muted: #a6b7aa;
  --green: #71c995;
  --green-dark: #8ce0aa;
  --green-light: #253b2d;
  --border: #34483a;
  --red: #ff8585;
  --red-light: #452727;
  --yellow: #40391f;
  --shadow: 0 3px 14px rgba(0,0,0,.15);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.toprow {
  max-width: 720px;
  margin: auto;
  padding: 11px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.brand {
  color: var(--green-dark);
  font-size: 22px;
  font-weight: 800;
  line-height: 1.2;
}

.brand small {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  margin-top: 3px;
}

.iconbtn {
  padding: 8px 11px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 15px 12px 28px;
}

.message {
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.quiz-name {
  font-size: 15px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.question-count {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

.attempt-badge {
  display: inline-flex;
  align-items: center;
  margin-top: 6px;
  padding: 4px 9px;
  border-radius: 20px;
  background: var(--green-light);
  color: var(--green-dark);
  font-size: 11px;
  font-weight: 700;
}

.timer-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 13px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 13px;
  box-shadow: var(--shadow);
}

.timer-label {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}

.timer {
  margin-top: 3px;
  font-size: clamp(19px, 5vw, 23px);
  font-weight: 800;
  color: var(--green-dark);
  font-variant-numeric: tabular-nums;
}

.timer.warning {
  color: var(--red);
}

.progress-track {
  height: 5px;
  background: var(--border);
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 14px;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: var(--green);
  transition: width .2s;
}

.card {
  padding: clamp(13px, 4vw, 22px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  box-shadow: var(--shadow);
}

.q-label {
  color: var(--green-dark);
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 10px;
  letter-spacing: .3px;
}

.question {
  font-size: clamp(15px, 4vw, 18px);
  font-weight: 600;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.question-image {
  display: none;
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  margin-top: 13px;
  border-radius: 10px;
  background: var(--bg);
}

.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
  margin-top: 18px;
}

.option {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  text-align: left;
  border-radius: 11px;
  line-height: 1.5;
  font-size: 14px;
}

.option-letter {
  flex: 0 0 27px;
  height: 27px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
}

.option-text {
  min-width: 0;
  padding-top: 3px;
  overflow-wrap: anywhere;
}

.option.selected {
  border: 1.5px solid var(--green-dark);
  background: var(--green-light);
}

.option.correct {
  border: 1.5px solid #58ae79;
  background: #e0f6e8;
  color: #285e3b;
}

.option.wrong {
  border: 1.5px solid var(--red);
  background: var(--red-light);
  color: #943b42;
}

body.dark .option.correct {
  background: #254633;
  color: #e3ffeb;
}

body.dark .option.wrong {
  background: #452727;
  color: #ffe9e9;
}

.option:disabled {
  opacity: 1;
  cursor: default;
}

.feedback {
  display: none;
  padding: 12px;
  border-radius: 11px;
  margin-top: 13px;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.feedback.show {
  display: block;
}

.feedback.good {
  background: var(--green-light);
  border: 1px solid var(--green);
}

.feedback.bad {
  background: var(--yellow);
  border: 1px solid #e1cb79;
}

.action-row,
.navigation {
  display: flex;
  gap: 9px;
  margin-top: 14px;
}

.btn {
  min-width: 0;
  min-height: 42px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
}

.btn-primary {
  background: #bde8cb;
  color: #205b36;
  border: 1px solid #a5dbb7;
}

.btn-primary:active {
  background: #a9dfbb;
}

body.dark .btn-primary {
  background: #355c42;
  color: #e8ffed;
  border-color: #477553;
}

.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}

.action-row .btn,
.navigation .btn {
  flex: 1;
}

.submit-area {
  margin-top: 17px;
  padding-top: 15px;
  border-top: 1px solid var(--border);
}

.submit-area .btn {
  width: 100%;
}

.note {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 9px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 18px 0 4px;
}

@media (min-width: 560px) {
  .container {
    padding-top: 22px;
  }

  .options {
    grid-template-columns: 1fr 1fr;
  }

  .question-image {
    max-height: 340px;
  }
}

@media (max-width: 340px) {
  .toprow {
    padding-left: 10px;
    padding-right: 10px;
  }

  .container {
    padding-left: 9px;
    padding-right: 9px;
  }

  .action-row {
    flex-direction: column;
  }

  .btn {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="toprow">
    <div class="brand">
      mNEET
      <small>Practice · Improve · Succeed</small>
    </div>
    <button class="iconbtn" id="themeBtn" type="button">🌙 Dark</button>
  </div>
</header>

<main class="container">

  <div id="loading" class="message">Quiz লোড হচ্ছে...</div>
  <div id="errorBox" class="message hidden"></div>

  <section id="quizArea" class="hidden">

    <div class="info-row">
      <div>
        <div class="quiz-name" id="quizTitle">Practice Quiz</div>
        <div class="question-count" id="questionCount"></div>
        <div class="attempt-badge" id="attemptBadge">Attempt No. 1</div>
      </div>

      <button class="iconbtn" id="exitBtn" type="button">Exit</button>
    </div>

    <div class="timer-card">
      <div>
        <div class="timer-label">TIME LEFT FOR THIS QUESTION</div>
        <div class="timer" id="questionTimer">01:00</div>
      </div>

      <div>
        <div class="timer-label">TOTAL TIME</div>
        <div class="timer" id="totalTimer">00:00</div>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="card">
      <div class="q-label" id="questionLabel">QUESTION 1</div>

      <div class="question" id="questionText"></div>

      <img id="questionImage" class="question-image" alt="Question diagram">

      <div class="options" id="options"></div>
      <div id="feedback" class="feedback"></div>

      <div class="action-row">
        <button class="btn btn-primary" id="answerBtn" type="button">
          Submit Answer
        </button>

        <button class="btn btn-secondary" id="clearBtn" type="button">
          Clear
        </button>
      </div>

      <div class="navigation">
        <button class="btn btn-secondary" id="prevBtn" type="button">
          ← Previous
        </button>

        <button class="btn btn-primary" id="nextBtn" type="button">
          Next →
        </button>
      </div>

      <div class="submit-area">
        <button class="btn btn-primary" id="submitQuizBtn" type="button">
          Submit Quiz
        </button>

        <div class="note">
          Submit Answer দিয়ে উত্তর যাচাই করো।
          সব প্রশ্ন শেষ হলে Submit Quiz চাপো।
        </div>
      </div>
    </div>
  </section>

  <div class="footer">mNEET · Practice. Improve. Succeed.</div>
</main>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  const KEYS = {
    subject: "activeSubject",
    chapter: "activeChapter",
    quizType: "activeQuizType",
    result: "mneetQuizResult"
  };

  const QUESTION_SECONDS = 60;

  let questions = [];
  let answers = {};
  let currentIndex = 0;
  let questionSeconds = QUESTION_SECONDS;
  let totalSeconds = 0;
  let questionInterval = null;
  let totalInterval = null;
  let answeredThisVisit = false;
  let quizSubmitted = false;
  let quizTitle = "Practice Quiz";
  let sessionKey = "";
  let attemptNo = 1;
  let initializing = false;

  /* Theme */

  function getTheme() {
    return localStorage.getItem("mneetTheme") || "light";
  }

  function applyTheme() {
    const dark = getTheme() === "dark";
    document.body.classList.toggle("dark", dark);
    $("themeBtn").textContent = dark ? "☀️ Light" : "🌙 Dark";
  }

  $("themeBtn").addEventListener("click", () => {
    localStorage.setItem(
      "mneetTheme",
      getTheme() === "dark" ? "light" : "dark"
    );
    applyTheme();
  });

  applyTheme();

  function showError(message) {
    stopAllTimers();
    $("loading").classList.add("hidden");
    $("quizArea").classList.add("hidden");
    $("errorBox").classList.remove("hidden");
    $("errorBox").textContent = message;
  }

  function formatTime(seconds) {
    seconds = Math.max(0, Math.floor(Number(seconds) || 0));

    return String(Math.floor(seconds / 60)).padStart(2, "0") +
      ":" +
      String(seconds % 60).padStart(2, "0");
  }

  function stopQuestionTimer() {
    if (questionInterval !== null) {
      clearInterval(questionInterval);
      questionInterval = null;
    }
  }

  function stopAllTimers() {
    stopQuestionTimer();

    if (totalInterval !== null) {
      clearInterval(totalInterval);
      totalInterval = null;
    }
  }

  /* Attempt number */

  function getAttemptCounterKey() {
    return "mneetAttemptCount_" +
      (localStorage.getItem(KEYS.subject) || "") + "_" +
      (localStorage.getItem(KEYS.chapter) || "") + "_" +
      (localStorage.getItem(KEYS.quizType) || "");
  }

  function startNewAttempt() {
    const counterKey = getAttemptCounterKey();

    attemptNo = (Number(localStorage.getItem(counterKey)) || 0) + 1;
    localStorage.setItem(counterKey, String(attemptNo));

    answers = {};
    currentIndex = 0;
    totalSeconds = 0;
    questionSeconds = QUESTION_SECONDS;
    quizSubmitted = false;

    /*
     * Each page opening starts a fresh attempt.
     * The old result is not deleted here.
     */
    if (sessionKey) {
      localStorage.removeItem(sessionKey);
    }

    saveProgress();
    $("attemptBadge").textContent = "Attempt No. " + attemptNo;
  }

  function saveProgress() {
    if (!sessionKey || quizSubmitted) return;

    try {
      const q = questions[currentIndex];

      if (q && !answers[q.id]?.submitted) {
        answers[q.id] = {
          ...(answers[q.id] || {}),
          secondsLeft: questionSeconds
        };
      }

      localStorage.setItem(sessionKey, JSON.stringify({
        answers,
        currentIndex,
        totalSeconds,
        questionSeconds,
        attemptNo,
        quizSubmitted: false
      }));
    } catch (error) {
      console.warn("Progress save failed:", error);
    }
  }

  function normalizeQuestion(doc) {
    const data = doc.data() || {};
    const rawOptions = data.options || {};
    let options;

    if (Array.isArray(rawOptions)) {
      options = rawOptions.map((value, index) => ({
        letter: ["A", "B", "C", "D"][index] || String(index + 1),
        text: typeof value === "object"
          ? String(value.text ?? value.label ?? "")
          : String(value ?? "")
      }));
    } else {
      options = ["A", "B", "C", "D"].map(letter => ({
        letter,
        text: rawOptions[letter] == null
          ? ""
          : String(
              typeof rawOptions[letter] === "object"
                ? rawOptions[letter].text ?? rawOptions[letter].label ?? ""
                : rawOptions[letter]
            )
      }));
    }

    let correct = String(
      data.correctOption ?? data.correctAnswer ?? ""
    ).trim().toUpperCase();

    if (["0", "1", "2", "3"].includes(correct)) {
      correct = ["A", "B", "C", "D"][Number(correct)];
    }

    return {
      id: doc.id,
      question: String(
        data.question || data.questionText || data.text || ""
      ),
      imageUrl: String(data.imageUrl || ""),
      options,
      correctOption: correct,
      solution: String(data.solution || data.explanation || ""),
      order: Number(data.order) || 0
    };
  }

  /* Initialize */

  async function initQuiz() {
    if (initializing) return;
    initializing = true;

    try {
      if (!window.mneetFirebaseReady || !window.auth || !window.db) {
        throw new Error(
          "Firebase প্রস্তুত হয়নি। js/firebase.js পরীক্ষা করো।"
        );
      }

      const user = window.auth.currentUser;

      if (!user) {
        window.location.replace("index.html");
        return;
      }

      const subjectId = localStorage.getItem(KEYS.subject);
      const chapterId = localStorage.getItem(KEYS.chapter);
      const quizTypeId = localStorage.getItem(KEYS.quizType);

      if (!subjectId || !chapterId || !quizTypeId) {
        throw new Error(
          "Quiz নির্বাচন পাওয়া যায়নি। Dashboard থেকে আবার Quiz নির্বাচন করো।"
        );
      }

      const profileDoc = await window.db
        .collection("users")
        .doc(user.uid)
        .get();

      if (
        !profileDoc.exists ||
        profileDoc.data().role !== "student" ||
        profileDoc.data().status !== "active"
      ) {
        await window.auth.signOut();
        window.location.replace("index.html");
        return;
      }

      const subjectRef = window.db.collection("subjects").doc(subjectId);
      const chapterRef = subjectRef.collection("chapters").doc(chapterId);
      const quizRef = chapterRef.collection("quizTypes").doc(quizTypeId);

      const [subjectDoc, chapterDoc, quizDoc] = await Promise.all([
        subjectRef.get(),
        chapterRef.get(),
        quizRef.get()
      ]);

      if (
        !subjectDoc.exists ||
        subjectDoc.data().published !== true ||
        !chapterDoc.exists ||
        chapterDoc.data().published !== true ||
        !quizDoc.exists ||
        quizDoc.data().published !== true
      ) {
        throw new Error("এই Quiz প্রকাশিত নেই অথবা পাওয়া যায়নি।");
      }

      quizTitle = quizDoc.data().name ||
        quizDoc.data().title ||
        "Practice Quiz";

      $("quizTitle").textContent = quizTitle;

      const snapshot = await quizRef
        .collection("questions")
        .where("published", "==", true)
        .get();

      questions = snapshot.docs
        .map(normalizeQuestion)
        .filter(q => q.question || q.imageUrl)
        .sort((a, b) => a.order - b.order);

      if (!questions.length) {
        throw new Error(
          "এই Quiz-এ কোনো প্রকাশিত প্রশ্ন নেই। Admin-কে প্রশ্ন প্রকাশ করতে বলো।"
        );
      }

      sessionKey = "mneetQuiz_" +
        user.uid + "_" +
        subjectId + "_" +
        chapterId + "_" +
        quizTypeId;

      /*
       * A fresh attempt is started on each opening.
       * This avoids the old submitted-state message.
       */
      startNewAttempt();

      $("loading").classList.add("hidden");
      $("errorBox").classList.add("hidden");
      $("quizArea").classList.remove("hidden");

      renderQuestion();
      startTotalTimer();
      startQuestionTimer();

    } catch (error) {
      console.error("Quiz loading error:", error);
      showError(error.message || "Quiz লোড করা যায়নি।");
    } finally {
      initializing = false;
    }
  }

  /* Question renderer */

  function renderQuestion() {
    const q = questions[currentIndex];
    if (!q) return;

    answeredThisVisit = answers[q.id]?.submitted === true;

    $("questionCount").textContent =
      "Question " + (currentIndex + 1) + " of " + questions.length;

    $("questionLabel").textContent =
      "QUESTION " + (currentIndex + 1);

    $("questionText").textContent = q.question;

    const image = $("questionImage");

    if (q.imageUrl && /^https?:\/\//i.test(q.imageUrl)) {
      image.src = q.imageUrl;
      image.style.display = "block";
      image.onerror = () => {
        image.style.display = "none";
      };
    } else {
      image.removeAttribute("src");
      image.style.display = "none";
    }

    $("progressBar").style.width =
      ((currentIndex + 1) / questions.length * 100) + "%";

    $("prevBtn").disabled = currentIndex === 0;

    $("nextBtn").textContent =
      currentIndex === questions.length - 1
        ? "Last Question"
        : "Next →";

    questionSeconds = Number.isFinite(answers[q.id]?.secondsLeft)
      ? Math.max(0, answers[q.id].secondsLeft)
      : QUESTION_SECONDS;

    const savedAnswer = answers[q.id]?.selected || "";
    const optionBox = $("options");

    optionBox.replaceChildren();

    q.options.forEach(option => {
      if (!option.text) return;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";

      const letter = document.createElement("span");
      letter.className = "option-letter";
      letter.textContent = option.letter;

      const text = document.createElement("span");
      text.className = "option-text";
      text.textContent = option.text;

      button.append(letter, text);

      if (savedAnswer === option.letter) {
        button.classList.add("selected");
      }

      if (answeredThisVisit) {
        button.disabled = true;

        if (option.letter === q.correctOption) {
          button.classList.add("correct");
        }

        if (
          option.letter === savedAnswer &&
          savedAnswer !== q.correctOption
        ) {
          button.classList.add("wrong");
        }
      } else {
        button.addEventListener("click", () => {
          selectOption(q.id, option.letter);
        });
      }

      optionBox.appendChild(button);
    });

    $("answerBtn").disabled = answeredThisVisit;
    $("clearBtn").disabled = answeredThisVisit;

    showFeedback(q);
    updateQuestionTimer();
    saveProgress();
  }

  function selectOption(questionId, letter) {
    if (answeredThisVisit || quizSubmitted) return;

    answers[questionId] = {
      ...(answers[questionId] || {}),
      selected: letter,
      submitted: false,
      secondsLeft: questionSeconds
    };

    $("options").querySelectorAll(".option").forEach(button => {
      button.classList.remove("selected");

      if (
        button.querySelector(".option-letter").textContent === letter
      ) {
        button.classList.add("selected");
      }
    });

    saveProgress();
  }

  function showFeedback(q) {
    const box = $("feedback");
    const saved = answers[q.id];

    box.className = "feedback";
    box.replaceChildren();

    if (!saved || !saved.submitted) return;

    const isCorrect = saved.selected === q.correctOption;

    box.classList.add("show", isCorrect ? "good" : "bad");

    const heading = document.createElement("strong");
    heading.textContent = isCorrect
      ? "Correct Answer ✓"
      : "Incorrect Answer";
    box.appendChild(heading);

    if (!isCorrect) {
      const line = document.createElement("div");
      line.textContent = "Correct Answer: " + q.correctOption;
      box.appendChild(line);
    }

    if (q.solution) {
      const solution = document.createElement("p");
      solution.textContent = "Solution: " + q.solution;
      box.appendChild(solution);
    }
  }

  function submitAnswer() {
    const q = questions[currentIndex];

    if (!q || answeredThisVisit || quizSubmitted) return;

    const selected = answers[q.id]?.selected;

    if (!selected) {
      alert("আগে একটি উত্তর নির্বাচন করো।");
      return;
    }

    if (!["A", "B", "C", "D"].includes(q.correctOption)) {
      alert("এই প্রশ্নের Correct Option Admin সেট করেননি।");
      return;
    }

    answers[q.id] = {
      ...answers[q.id],
      selected,
      submitted: true,
      correct: selected === q.correctOption,
      secondsLeft: questionSeconds
    };

    answeredThisVisit = true;

    stopQuestionTimer();
    renderQuestion();
    saveProgress();
  }

  function clearAnswer() {
    const q = questions[currentIndex];

    if (!q || answeredThisVisit || quizSubmitted) return;

    delete answers[q.id];

    $("options").querySelectorAll(".option").forEach(button => {
      button.classList.remove("selected");
    });

    saveProgress();
  }

  /* Timers */

  function updateQuestionTimer() {
    $("questionTimer").textContent = formatTime(questionSeconds);

    $("questionTimer").classList.toggle(
      "warning",
      questionSeconds <= 10
    );
  }

  function startQuestionTimer() {
    stopQuestionTimer();

    if (answeredThisVisit || quizSubmitted) return;

    updateQuestionTimer();

    if (questionSeconds <= 0) {
      handleQuestionTimeout();
      return;
    }

    questionInterval = setInterval(() => {
      questionSeconds--;

      const q = questions[currentIndex];

      if (q) {
        answers[q.id] = {
          ...(answers[q.id] || {}),
          secondsLeft: questionSeconds
        };
      }

      updateQuestionTimer();
      saveProgress();

      if (questionSeconds <= 0) {
        handleQuestionTimeout();
      }
    }, 1000);
  }

  function handleQuestionTimeout() {
    stopQuestionTimer();

    const q = questions[currentIndex];

    if (!q || answeredThisVisit || quizSubmitted) return;

    answers[q.id] = {
      ...(answers[q.id] || {}),
      secondsLeft: 0,
      timedOut: true
    };

    questionSeconds = 0;
    updateQuestionTimer();
    saveProgress();

    alert("এই প্রশ্নের সময় শেষ। Next চাপ দিয়ে এগিয়ে যাও।");
  }

  function startTotalTimer() {
    $("totalTimer").textContent = formatTime(totalSeconds);

    if (totalInterval !== null) {
      clearInterval(totalInterval);
    }

    totalInterval = setInterval(() => {
      if (quizSubmitted) return;

      totalSeconds++;
      $("totalTimer").textContent = formatTime(totalSeconds);
      saveProgress();
    }, 1000);
  }

  /* Navigation */

  function goToQuestion(index) {
    if (index < 0 || index >= questions.length || quizSubmitted) return;

    stopQuestionTimer();

    const oldQ = questions[currentIndex];

    if (oldQ && !answers[oldQ.id]?.submitted) {
      answers[oldQ.id] = {
        ...(answers[oldQ.id] || {}),
        secondsLeft: questionSeconds
      };
    }

    currentIndex = index;
    renderQuestion();
    startQuestionTimer();
    saveProgress();
  }

  /* Final submit */

  function submitQuiz() {
    if (quizSubmitted) return;

    const unanswered = questions.filter(q =>
      !answers[q.id]?.submitted
    ).length;

    const message = unanswered > 0
      ? unanswered +
        "টি প্রশ্ন Submit Answer করা হয়নি। তবুও Quiz Submit করবে?"
      : "Quiz Submit করবে?";

    if (!confirm(message)) return;

    stopAllTimers();

    let correct = 0;
    let incorrect = 0;
    let skipped = 0;

    const resultQuestions = questions.map(q => {
      const answer = answers[q.id] || {};
      const submitted = answer.submitted === true;
      const selected = answer.selected || "";
      const isCorrect = submitted && selected === q.correctOption;

      if (!submitted) skipped++;
      else if (isCorrect) correct++;
      else incorrect++;

      return {
        id: q.id,
        question: q.question,
        questionText: q.question,
        imageUrl: q.imageUrl,
        options: q.options.map(option => ({
          letter: option.letter,
          text: option.text
        })),
        selectedAnswer: selected,
        correctAnswer: q.correctOption,
        selected,
        correctOption: q.correctOption,
        submitted,
        correct: isCorrect,
        solution: q.solution,
        secondsLeft: answer.secondsLeft ?? 0
      };
    });

    const attempted = correct + incorrect;

    const result = {
      quizTitle,
      quizTypeName: quizTitle,
      subjectId: localStorage.getItem(KEYS.subject) || "",
      chapterId: localStorage.getItem(KEYS.chapter) || "",
      quizTypeId: localStorage.getItem(KEYS.quizType) || "",
      attemptNo,
      totalQuestions: questions.length,
      attempted,
      correct,
      incorrect,
      skipped,
      score: correct,
      accuracy: attempted
        ? Math.round(correct / attempted * 100)
        : 0,
      totalTimeSeconds: totalSeconds,
      totalTime: totalSeconds,
      submittedAt: new Date().toISOString(),
      questions: resultQuestions
    };

    try {
      localStorage.setItem(KEYS.result, JSON.stringify(result));

      quizSubmitted = true;

      localStorage.setItem(sessionKey, JSON.stringify({
        answers,
        currentIndex,
        totalSeconds,
        questionSeconds,
        attemptNo,
        quizSubmitted: true
      }));

      window.location.href = "result.html";

    } catch (error) {
      quizSubmitted = false;
      startTotalTimer();

      alert("Result সংরক্ষণ করা যায়নি। Browser storage পরীক্ষা করো।");
    }
  }

  /* Events */

  $("answerBtn").addEventListener("click", submitAnswer);
  $("clearBtn").addEventListener("click", clearAnswer);

  $("prevBtn").addEventListener("click", () => {
    goToQuestion(currentIndex - 1);
  });

  $("nextBtn").addEventListener("click", () => {
    if (currentIndex < questions.length - 1) {
      goToQuestion(currentIndex + 1);
    } else {
      alert("এটাই শেষ প্রশ্ন। Quiz শেষ করতে Submit Quiz চাপো।");
    }
  });

  $("submitQuizBtn").addEventListener("click", submitQuiz);

  $("exitBtn").addEventListener("click", () => {
    if (confirm("Quiz থেকে বের হতে চাও?")) {
      saveProgress();
      stopAllTimers();
      window.location.href = "quiz-types.html";
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) saveProgress();
  });

  window.addEventListener("beforeunload", () => {
    saveProgress();
    stopAllTimers();
  });

  /* Authentication */

  if (window.auth) {
    window.auth.onAuthStateChanged(user => {
      if (user) {
        initQuiz();
      } else {
        window.location.replace("index.html");
      }
    });
  } else {
    showError(
      "Firebase পাওয়া যায়নি। js/firebase.js পরীক্ষা করো।"
    );
  }

})();
</script>

</body>
